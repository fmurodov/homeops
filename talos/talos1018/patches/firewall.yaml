# Host ingress firewall (homeops-project#130). The default stays accept; each
# rule below drops new connections to its ports from any source not listed.
# Not block mode: that needs a rule for every host listener (hostNetwork pods,
# Gateway Envoy, BGP) and caps all inbound ICMPv6, neighbour discovery
# included, at 5 packets/s.
#
# Each rule takes one protocol and lists its sources in full (YAML anchors
# don't cross documents).
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-apid
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress:
  # Admins, IPv6 only, GUA and ULA: VLANs core, lan, srv (with the nodes, and
  # rock64 where NetBird arrives masqueraded) and lan6. IoT, guest and security
  # are left out.
  - subnet: ${IPV6_PREFIX_GUA}::/64
  - subnet: ${IPV6_PREFIX_GUA}:1::/64
  - subnet: ${IPV6_PREFIX_GUA}:5::/64
  - subnet: ${IPV6_PREFIX_GUA}:6::/64
  - subnet: fd6d:cefe:ddc3::/64
  - subnet: fd6d:cefe:ddc3:1::/64
  - subnet: fd6d:cefe:ddc3:5::/64
  - subnet: fd6d:cefe:ddc3:6::/64
  # UniFi WireGuard wgsrv1; its clients use IPv4 until homeops-project#123
  - subnet: 10.18.201.0/24
  - subnet: fda3:972:16a0::/64
  # Nodes over IPv4
  - subnet: 10.18.6.91/32
  - subnet: 10.18.6.92/32
  - subnet: 10.18.6.93/32
  # Pods (tuppr and talos-backup use the Talos API)
  - subnet: ${IPV6_PREFIX_GUA}:100::/56
  - subnet: 10.244.0.0/16
---
