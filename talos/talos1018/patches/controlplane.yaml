machine:
  certSANs:
    - ::1
    - fd00:1018:0:5:10:18:6:91
    - fd00:1018:0:5:10:18:6:92
    - fd00:1018:0:5:10:18:6:93
    - 10.18.6.91
    - 10.18.6.92
    - 10.18.6.93
    - 127.0.0.1

  features:
    rbac: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true

cluster:
  etcd:
    advertisedSubnets:
      - fd00:1018:0:5::/64
      - 10.18.6.0/24
    extraArgs:
      listen-metrics-urls: "http://[::]:2381"
---
# gen config defaults to /dev/sda, which on these nodes is a Longhorn volume
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: true
---
# Off until the sandboxd evaluation: with it on, kubelet can't reach the host
# iscsid that Longhorn v1 uses
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  rotate-server-certificates: "true"
# EPHEMERAL is a fixed 100 GiB holding little besides the image store.
# GC starts below kubelet's imagefs eviction threshold (15% free), which
# the default 85% would race.
config:
  imageGCHighThresholdPercent: 75
  imageGCLowThresholdPercent: 65
  imageMaximumGCAge: 168h
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - ::1
  - fd00:1018:0:5:10:18:6:91
  - fd00:1018:0:5:10:18:6:92
  - fd00:1018:0:5:10:18:6:93
  - 10.18.6.91
  - 10.18.6.92
  - 10.18.6.93
  - 127.0.0.1
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: "::"
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: "::"
---
# Talos' default. Anonymous access is limited to the health endpoints, which
# the kube-apiserver probes added at this contract hit unauthenticated. The
# document can't be dropped (the API server gets an empty
# --authentication-config file and refuses to start), and turning anonymous
# off entirely fails the startup probe.
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt: []
---
# CNI is Cilium (deployed by Flux), not Flannel
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Labels and taints are taken literally here, unlike v1alpha1 which added the
# control-plane label itself. No NoSchedule taint: every node is a control plane.
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - fd00:1018:0:5::/64
    - 10.18.6.0/24
labels:
  node-role.kubernetes.io/control-plane: ""
  node.kubernetes.io/exclude-from-external-load-balancers: ""
  node.longhorn.io/create-default-disk: "true"
taints:
  $patch: delete
---
# The IPv6 service subnet was /96 until Oct 2026; KubeNetworkConfig rejects
# anything wider than /108, so it was shrunk to the /108 holding ::1 and ::a
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - fd00:1018:1000::/56
  - 10.244.0.0/16
serviceSubnets:
  - fd00:1018:2000::/108
  - 10.96.0.0/12
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: kubelet-serving-cert-approver
url: https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: metrics-server
url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: fd00:1018:0:5::1
searchDomains:
  domains:
    - cluster.local
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
# Lets tuppr drive node upgrades (os:admin) and talos-backup take etcd
# snapshots (os:etcd:backup) over the Talos API. Scoped to the single
# namespace both run in — os:admin is full control of the node.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
  - os:etcd:backup
allowedKubernetesNamespaces:
  - system-upgrade
---
# Bootstrap add-ons Talos should not manage.
#
# kube-proxy: replaced by Cilium's kube-proxy replacement.
#
# CoreDNS: Talos always renders the kube-dns Service IPv4-primary
# regardless of serviceSubnets order, so on a v6-primary cluster every
# `upgrade-k8s` aborts on the immutable clusterIPs/ipFamilies fields and no
# bootstrap manifest gets applied. Flux owns CoreDNS instead.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
# Stable /dev/thread0 symlink for the USB Thread dongles
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  - SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60", SYMLINK+="thread0", MODE="0666"
---
# Keep compressed layers after unpacking so Spegel has blobs to serve to peers
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: spegel
content: |-
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
---
# useNTS applies to every server and rejects IP literals, so only servers
# that answer NTS-KE on TCP 4460 belong here
apiVersion: v1alpha1
kind: TimeSyncConfig
bootTimeout: 2m0s
ntp:
  useNTS: true
  servers:
    - time.cloudflare.com
    - nts.time.nl
    - nts.netnod.se
    - ptbtime1.ptb.de
---
# EPHEMERAL used to fill the disk, with Longhorn as a directory on it. Both
# only apply when a volume is provisioned; resizing either needs a node
# rebuild (`talosctl reset --system-labels-to-wipe EPHEMERAL`).
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  minSize: 100GiB
  maxSize: 100GiB
  grow: false
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: system_disk
  minSize: 300GiB
  grow: true
---
# Upgraded clusters have no trim schedule; all nodes are NVMe
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
# NOTE: pod IPv6 internet egress relies on SLAAC. Besides the static ULA/IPv4
# addresses in the node patches, each node autoconfigures a GUA address (EUI-64)
# from router advertisements on the untagged LAN. Cilium's IPv6 masquerade picks
# that GUA as the source for pod -> internet IPv6 traffic, so egress keeps
# working (and renumbers automatically) when the ISP prefix changes. Do not
# disable RA acceptance on net0 or router advertisements on this segment.
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: fd00:1018:0:5:10:18:6:90
link: net0
---
apiVersion: v1alpha1
kind: VLANConfig
name: net0.2
vlanID: 2
parent: net0
---
apiVersion: v1alpha1
kind: VLANConfig
name: net0.3
vlanID: 3
parent: net0
