machine:
  certSANs:
    - ::1
    - fd6d:cefe:ddc3:5:10:18:6:90
    - fd6d:cefe:ddc3:5:10:18:6:91
    - fd6d:cefe:ddc3:5:10:18:6:92
    - fd6d:cefe:ddc3:5:10:18:6:93
    - 10.18.6.91
    - 10.18.6.92
    - 10.18.6.93
    - 127.0.0.1

  features:
    rbac: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true

  # VLANs 2 and 3 exist only as parents for Multus pods (otbr, Home Assistant).
  # Without these the nodes take SLAAC addresses on them, which puts the API
  # server, kubelet, apid and etcd metrics on-link in LAN and IoT, past the UniFi
  # firewall (homeops-project#130). The '/' stands for the '.' in the interface
  # name. RA handling inside the pods is separate, so otbr still gets its RAs.
  sysctls:
    net.ipv6.conf.net0/2.autoconf: "0"
    net.ipv6.conf.net0/2.accept_ra: "0"
    net.ipv6.conf.net0/3.autoconf: "0"
    net.ipv6.conf.net0/3.accept_ra: "0"

cluster:
  etcd:
    # Peer URLs come from these. The IPv4 one keeps peers reachable while the
    # stored member URLs catch up with the IPv6 change. The VIP moves between
    # nodes, so it must not become a peer URL.
    advertisedSubnets:
      - fd6d:cefe:ddc3:5::/64
      - 10.18.6.0/24
      - "!fd6d:cefe:ddc3:5:10:18:6:90/128"
    extraArgs:
      listen-metrics-urls: "http://[::]:2381"
---
# gen config defaults to /dev/sda, which on these nodes is a Longhorn volume
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: true
---
# Off until the sandboxd evaluation: with it on, kubelet can't reach the host
# iscsid that Longhorn v1 uses
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  rotate-server-certificates: "true"
# EPHEMERAL is a fixed 100 GiB holding little besides the image store.
# GC starts below kubelet's imagefs eviction threshold (15% free), which
# the default 85% would race.
config:
  imageGCHighThresholdPercent: 75
  imageGCLowThresholdPercent: 65
  imageMaximumGCAge: 168h
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - ::1
  - fd6d:cefe:ddc3:5:10:18:6:90
  - fd6d:cefe:ddc3:5:10:18:6:91
  - fd6d:cefe:ddc3:5:10:18:6:92
  - fd6d:cefe:ddc3:5:10:18:6:93
  - 10.18.6.91
  - 10.18.6.92
  - 10.18.6.93
  - 127.0.0.1
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: "::"
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: "::"
---
# Talos' default. Anonymous access is limited to the health endpoints, which
# the kube-apiserver probes added at this contract hit unauthenticated. The
# document can't be dropped (the API server gets an empty
# --authentication-config file and refuses to start), and turning anonymous
# off entirely fails the startup probe.
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt: []
---
# CNI is Cilium (deployed by Flux), not Flannel
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Labels and taints are taken literally here, unlike v1alpha1 which added the
# control-plane label itself. No NoSchedule taint: every node is a control plane.
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - fd6d:cefe:ddc3:5::/64
    - 10.18.6.0/24
labels:
  node-role.kubernetes.io/control-plane: ""
  node.kubernetes.io/exclude-from-external-load-balancers: ""
  node.longhorn.io/create-default-disk: "true"
taints:
  $patch: delete
---
# The IPv6 service subnet was /96 until Oct 2026; KubeNetworkConfig rejects
# anything wider than /108, so it was shrunk to the /108 holding ::1 and ::a
# Pods get global addresses (homeops-project#113) so they prefer IPv6 by
# RFC 6724; was fd00:1018:1000::/56. ${IPV6_PREFIX_GUA} is filled in by
# generate.sh.
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - ${IPV6_PREFIX_GUA}:100::/56
  - 10.244.0.0/16
serviceSubnets:
  - fd00:1018:2000::/108
  - 10.96.0.0/12
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: kubelet-serving-cert-approver
url: https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/v0.12.1/deploy/standalone-install.yaml
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: metrics-server
url: https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: fd6d:cefe:ddc3:5::1
searchDomains:
  domains:
    - cluster.local
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
# Lets tuppr drive node upgrades (os:admin) and talos-backup take etcd
# snapshots (os:etcd:backup) over the Talos API. Scoped to the single
# namespace both run in — os:admin is full control of the node.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
  - os:etcd:backup
allowedKubernetesNamespaces:
  - system-upgrade
---
# Bootstrap add-ons Talos should not manage.
#
# kube-proxy: replaced by Cilium's kube-proxy replacement.
#
# CoreDNS: Talos always renders the kube-dns Service IPv4-primary
# regardless of serviceSubnets order, so on a v6-primary cluster every
# `upgrade-k8s` aborts on the immutable clusterIPs/ipFamilies fields and no
# bootstrap manifest gets applied. Flux owns CoreDNS instead.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
# Stable /dev/thread0 symlink for the USB Thread dongles
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  - SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60", SYMLINK+="thread0", MODE="0666"
---
# Keep compressed layers after unpacking so Spegel has blobs to serve to peers
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: spegel
content: |-
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
---
# useNTS applies to every server and rejects IP literals, so only servers
# that answer NTS-KE on TCP 4460 belong here
apiVersion: v1alpha1
kind: TimeSyncConfig
bootTimeout: 2m0s
ntp:
  useNTS: true
  servers:
    - time.cloudflare.com
    - nts.time.nl
    - nts.netnod.se
    - ptbtime1.ptb.de
---
# EPHEMERAL used to fill the disk, with Longhorn as a directory on it. Both
# only apply when a volume is provisioned; resizing either needs a node
# rebuild (`talosctl reset --system-labels-to-wipe EPHEMERAL`).
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  minSize: 100GiB
  maxSize: 100GiB
  grow: false
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: system_disk
  minSize: 300GiB
  grow: true
---
# Upgraded clusters have no trim schedule; all nodes are NVMe
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
# NOTE: pod IPv6 internet egress relies on SLAAC. Besides the static ULA/IPv4
# addresses in the node patches, each node autoconfigures a GUA address (EUI-64)
# from router advertisements on the untagged LAN. Cilium's IPv6 masquerade picks
# that GUA as the source for pod -> internet IPv6 traffic, so egress keeps
# working (and renumbers automatically) when the ISP prefix changes. Do not
# disable RA acceptance on net0 or router advertisements on this segment.
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: fd6d:cefe:ddc3:5:10:18:6:90
link: net0
---
apiVersion: v1alpha1
kind: VLANConfig
name: net0.2
vlanID: 2
parent: net0
---
apiVersion: v1alpha1
kind: VLANConfig
name: net0.3
vlanID: 3
parent: net0
---
# Host ingress firewall (homeops-project#130). New connections to the node are
# dropped unless a rule below allows them. Talos itself always lets in loopback,
# replies, ICMP/ICMPv6 (5 packets/s each), pod/service to pod/service, and pods
# to host DNS. It does not see LB traffic Cilium hands to pods (that bypasses
# the host), but it does see traffic to hostNetwork pods and to the gateways'
# Envoy. Admin ranges: VLANs core, lan, srv and lan6 (IoT, guest and security
# are left out), wgsrv1 and NetBird. NetBird routing peers masquerade, so its
# traffic usually arrives from rock64 on srv.
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-apid
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress: &admin-and-pods
  - subnet: 10.18.1.0/24
  - subnet: 10.18.2.0/24
  - subnet: 10.18.6.0/24
  - subnet: 10.18.7.0/24
  - subnet: ${IPV6_PREFIX_GUA}::/64
  - subnet: ${IPV6_PREFIX_GUA}:1::/64
  - subnet: ${IPV6_PREFIX_GUA}:5::/64
  - subnet: ${IPV6_PREFIX_GUA}:6::/64
  - subnet: fd6d:cefe:ddc3:5::/64
  # UniFi WireGuard wgsrv1 (backup VPN)
  - subnet: 10.18.201.0/24
  - subnet: fda3:972:16a0::/64
  # NetBird overlay, in case a peer stops masquerading
  - subnet: 100.64.0.0/10
  # tuppr and talos-backup use the Talos API from pods
  - subnet: ${IPV6_PREFIX_GUA}:100::/56
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kube-apiserver
portSelector:
  ports:
    - 6443
  protocol: tcp
ingress: *admin-and-pods
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-trustd
portSelector:
  ports:
    - 50001
  protocol: tcp
ingress: &nodes
  - subnet: fd6d:cefe:ddc3:5:10:18:6:91/128
  - subnet: fd6d:cefe:ddc3:5:10:18:6:92/128
  - subnet: fd6d:cefe:ddc3:5:10:18:6:93/128
  - subnet: 10.18.6.91/32
  - subnet: 10.18.6.92/32
  - subnet: 10.18.6.93/32
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: etcd
portSelector:
  ports:
    - 2379-2380
  protocol: tcp
ingress: *nodes
---
# kubelet, etcd metrics, cilium-health, Hubble peer, node-exporter, Cilium
# agent/operator/Envoy/Hubble metrics, controller-manager, scheduler. Callers
# are the API server (nodes) and pods (metrics-server, vmagent, hubble-relay);
# pods reach other nodes' IPv4 masqueraded, so as node addresses.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: cluster-internal
portSelector:
  ports:
    - 2381
    - 4240
    - 4244
    - 9100
    - 9962-9965
    - 10250
    - 10257
    - 10259
  protocol: tcp
ingress:
  - subnet: fd6d:cefe:ddc3:5:10:18:6:91/128
  - subnet: fd6d:cefe:ddc3:5:10:18:6:92/128
  - subnet: fd6d:cefe:ddc3:5:10:18:6:93/128
  - subnet: 10.18.6.91/32
  - subnet: 10.18.6.92/32
  - subnet: 10.18.6.93/32
  - subnet: ${IPV6_PREFIX_GUA}:100::/56
  - subnet: 10.244.0.0/16
---
# Gateway listeners. Cilium steers Gateway traffic to Envoy on the host, so it
# passes this chain with the listener port. Nothing on the host itself listens
# on these ports. Who may reach each gateway stays with UniFi and the routes.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: gateway-tcp
portSelector:
  ports:
    - 22
    - 80
    - 443
  protocol: tcp
ingress: &anywhere
  - subnet: ::/0
  - subnet: 0.0.0.0/0
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: gateway-udp
portSelector:
  ports:
    - 69
  protocol: udp
ingress: *anywhere
---
# dn42-resolver runs hostNetwork on 1053 behind its LB. Same ranges as its
# unbound access-control.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: dn42-resolver-udp
portSelector:
  ports:
    - 1053
  protocol: udp
ingress: &home-48s
  - subnet: fd6d:cefe:ddc3::/48
  - subnet: ${IPV6_PREFIX_GUA}::/48
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: dn42-resolver-tcp
portSelector:
  ports:
    - 1053
  protocol: tcp
ingress: *home-48s
