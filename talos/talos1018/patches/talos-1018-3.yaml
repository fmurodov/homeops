apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-1018-3
---
# net0 alias for the physical interface (enp1s0)
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: mac(link.permanent_addr) == "a4:bb:6d:51:86:24"
---
apiVersion: v1alpha1
kind: LinkConfig
name: net0
addresses:
  - address: fd6d:cefe:ddc3:5:10:18:6:93/64
  - address: 10.18.6.93/24
routes:
  # Below the kernel's 1024 for RA default routes, which otherwise hold ::/0
  # (the static route then fails with "file exists") and can pick a VLAN
  # subinterface with that VLAN's GUA as source.
  - gateway: fd6d:cefe:ddc3:5::1
    metric: 512
  - gateway: 10.18.6.1
