# Applied once by hand at bootstrap (talos/ocivm-1/README.md). The repo is
# public, so no deploy key.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: master
  url: https://github.com/fmurodov/homeops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/ocivm-1
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
