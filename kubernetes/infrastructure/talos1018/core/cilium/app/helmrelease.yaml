---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.20.0
  interval: 1m0s
  install:
    # Allow Cilium to be installed even if CNI already exists
    # This is safe because we're taking over an existing Cilium installation
    skipCRDs: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart has no value for GatewayClass.spec.parametersRef. Patching the
  # rendered object keeps it Helm-owned, which matters because Cilium tears down
  # a Gateway's Service and CiliumEnvoyConfig if its GatewayClass disappears.
  # Nothing else in the release changes, so no pods restart.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: GatewayClass
              name: cilium
            patch: |
              - op: add
                path: /spec/parametersRef
                value:
                  group: cilium.io
                  kind: CiliumGatewayClassConfig
                  name: gateway-access-logs
                  namespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
