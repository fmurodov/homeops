# cilium-values.yaml
ipam:
  mode: kubernetes

l2announcements:
  enabled: true

kubeProxyReplacement: true

# Cilium is what resolves ClusterIPs, so it cannot reach the API server through
# the kubernetes ClusterIP that kubelet injects — on a rebooting node that
# deadlocks and the agent never starts. KubePrism proxies to the control plane on
# node-local loopback; it listens on IPv4 only, so the literal address is
# required rather than "localhost".
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445

# Gateway API support
gatewayAPI:
  enabled: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: true
  hostRoot: /sys/fs/cgroup

cni:
  exclusive: false

# Dual-stack configuration
ipv4:
  enabled: true
ipv6:
  enabled: true

# Native routing (no tunnel): all nodes share one L2 segment, so pod CIDRs are
# reachable via direct per-node routes without VXLAN encapsulation.
routingMode: "native"
autoDirectNodeRoutes: true

# Pod CIDRs are treated as internal (not masqueraded); must match clusterPodNets.
ipv4NativeRoutingCIDR: "10.244.0.0/16"
ipv6NativeRoutingCIDR: "fd00:1018:1000::/56"

# Masquerade is essential for ULA pods to reach the Internet
enableIPv6Masquerade: true
enableIPv4Masquerade: true
# Enables the per-service service.cilium.io/forwarding-mode annotation. Services
# without it keep the default SNAT, so this is inert until a service opts in.
bpf:
  lbModeAnnotation: true
#   masquerade: true

# Prometheus metrics for Cilium agent
prometheus:
  enabled: true

# Prometheus metrics for Cilium operator (:9963)
operator:
  prometheus:
    enabled: true

# Hubble observability
hubble:
  enabled: true

  relay:
    enabled: true

  ui:
    enabled: true

  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - http
