---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Cilium CNI - Controller (Helm deployment)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cilium-app
  namespace: flux-system
  annotations:
    # Moving into the apps parent (docs/infra-into-apps.md): the old parent
    # must not garbage-collect this object, and if it is ever deleted it
    # must not take its workloads with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
    - name: gateway-api-app
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/talos1018/core/cilium/app
  prune: true
  deletionPolicy: Orphan
  wait: true
---
# Cilium CNI - Config (CRDs - depends on controller)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cilium-config
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
    - name: infra-cilium-app
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/talos1018/core/cilium/config
  prune: true
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
