---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cert-manager
      version: v1.21.2
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 1m0s
  values:
    crds:
      enabled: true
    config:
      gatewayAPI:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 112Mi
    cainjector:
      resources:
        requests:
          cpu: 15m
          memory: 80Mi
    # failurePolicy is Fail: with the webhook down, every Certificate/Issuer
    # write in the cluster is rejected.
    webhook:
      replicaCount: 2
      resources:
        requests:
          cpu: 5m
          memory: 80Mi
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: cert-manager
              app.kubernetes.io/component: webhook
