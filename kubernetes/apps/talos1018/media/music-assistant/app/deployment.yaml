---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  labels:
    app.kubernetes.io/name: music-assistant
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: music-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: network/multus-macvlan2, network/multus-macvlan3
    spec:
      automountServiceAccountToken: false
      # Otherwise the music-assistant-* Services inject MUSIC_ASSISTANT_* variables.
      enableServiceLinks: false
      containers:
        - name: music-assistant
          image: ghcr.io/music-assistant/server:2.10.7
          ports:
            - name: http
              containerPort: 8095
              protocol: TCP
            - name: streamserver
              containerPort: 8097
              protocol: TCP
          env:
            - name: TZ
              value: "${TIMEZONE}"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 15m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
