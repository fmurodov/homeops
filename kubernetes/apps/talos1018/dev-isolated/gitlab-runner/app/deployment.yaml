---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  labels:
    app.kubernetes.io/name: gitlab-runner
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Two pods must never share one runner token.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-runner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9252"
    spec:
      serviceAccountName: gitlab-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 65533
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: gitlab/gitlab-runner:v19.3.1
          # Builds config.toml; the token can't live in the ConfigMap.
          command:
            - sh
            - /template/render.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /etc/gitlab-runner
            - name: tokens
              mountPath: /secrets
              readOnly: true
      containers:
        - name: gitlab-runner
          # renovate: datasource=docker depName=gitlab/gitlab-runner
          image: gitlab/gitlab-runner:v19.3.1
          command:
            - gitlab-runner
          args:
            - run
            - --config
            - /etc/gitlab-runner/config.toml
            - --working-directory
            - /home/gitlab-runner
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 9252
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          # Jobs run in their own pods under their own limits; this only polls.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab-runner
            - name: home
              mountPath: /home/gitlab-runner
      volumes:
        - name: config-template
          configMap:
            name: gitlab-runner-config
        - name: tokens
          secret:
            secretName: gitlab-runner-secret
        - name: config
          emptyDir: {}
        - name: home
          emptyDir: {}
