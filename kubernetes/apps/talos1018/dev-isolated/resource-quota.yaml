---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Defaults, so the quota below can't be dodged by omitting limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-isolated
  namespace: dev-isolated
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "1"
        memory: 2Gi
---
# Per-container limits don't bound the total, and `concurrent` is the runner's
# own setting — meaningless once a second runner shares the namespace. Worst case
# is two pods per slot (4 + manager = 3500m/5632Mi); `pods` binds first.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-isolated
  namespace: dev-isolated
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 10Gi
    pods: "10"
