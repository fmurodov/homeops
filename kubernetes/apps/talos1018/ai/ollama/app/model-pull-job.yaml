---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # renovate: datasource=docker depName=ollama/ollama
          image: ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: MODELS
              value: "llama3.1:8b"
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              until ollama list >/dev/null 2>&1; do
                echo "Waiting for ollama service to be ready..."
                sleep 5
              done
              for model in $MODELS; do
                echo "Pulling $model..."
                ollama pull "$model"
                echo "Verifying $model is present..."
                ollama list | awk '{print $1}' | grep -Fxq "$model"
              done
              echo "Done."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
