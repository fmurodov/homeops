---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.3
  policy:
    debug: false
    # No waitForVolumeDetach/nodrain: either makes tuppr own the drain, and its
    # single unordered pass livelocks on Longhorn's instance-manager PDB. Talos
    # ignores the 429 and leaves that pod up until reboot.
  # Alerts every node reboot trips. Held as a lease while the run is active;
  # faulted volumes, etcd quorum loss, crash loops and OOMs stay live.
  silences:
    - matchers:
        - name: alertname
          matchType: "=~"
          value: ^(NodeDown|LonghornNodeDown|LonghornVolumeStatusWarning|KubePodNotReady|KubeContainerWaiting|KubeDeploymentDown|KubeDeploymentReplicasMismatch|KubeStatefulSetDown|KubeStatefulSetReplicasMismatch|KubeDaemonSetNotReady|TargetDown|KubeSchedulerDown|KubeControllerManagerDown|CoreDNSDown|EtcdHighLeaderChanges|MatterDevicesUnavailable)$
      maxDuration: 2h
  healthChecks:
    - apiVersion: v1
      kind: Node
      description: All nodes Ready
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      description: No Longhorn volume rebuilding from the previous node
      # "unknown" is a detached volume; "degraded" means replicas are still rebuilding
      expr: status.robustness in ["healthy", "unknown"]
      timeout: 30m
