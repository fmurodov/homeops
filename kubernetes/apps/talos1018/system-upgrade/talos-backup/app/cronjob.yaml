---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
spec:
  # clear of the Longhorn daily-backup at 00:00
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: talos-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
              command: ["/talos-backup"]
              # snapshot and its encrypted copy are written to the working dir
              workingDir: /tmp
              env:
                - name: CLUSTER_NAME
                  value: talos1018
                # own bucket and key, so this job can't touch the Longhorn
                # backups; objects land under talos1018/ (the cluster name)
                - name: BUCKET
                  value: talos1018-etcd
                - name: AWS_REGION
                  value: eu-central-003
                # the SOPS age recipient: restoring needs only the key that
                # already decrypts this repo
                - name: AGE_X25519_PUBLIC_KEY
                  value: age1kesma5f5dadlzdl5lzgrtxl6e8z8frf7njsfnlnprzan0lmzgdmstnd39u
              envFrom:
                - secretRef:
                    name: talos-backup-b2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
          volumes:
            # holds the plain and the encrypted snapshot (~0.5 GiB each)
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: talos-secrets
              secret:
                secretName: talos-backup
