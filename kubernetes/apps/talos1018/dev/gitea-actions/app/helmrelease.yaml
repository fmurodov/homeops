---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea-actions
spec:
  chart:
    spec:
      chart: actions
      sourceRef:
        kind: HelmRepository
        name: gitea
  interval: 1h
  # The chart has no value for hostUsers. It is what makes DinD's privileged
  # flag stop meaning root on the node (homeops-project#135, see README.md).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: gitea-actions-runner
            patch: |
              - op: add
                path: /spec/template/spec/hostUsers
                value: false
  values:
    enabled: true

    # Not the in-cluster Service: job containers inherit this as
    # GITHUB_SERVER_URL, and only the gateway name has a cert they trust.
    giteaRootURL: https://gitea.${CLUSTER_DOMAIN}

    existingSecret: gitea-runner-secret
    existingSecretKey: token

    global:
      storageClass: longhorn

    statefulset:
      replicas: 1
      # No API token in the pod; see serviceaccount.yaml.
      serviceAccountName: gitea-actions-runner
      timezone: ${TIMEZONE}

      persistence:
        size: 2Gi

      # The chart leaves dockerd's image store on the container's writable layer,
      # i.e. the node's containerd filesystem. A capped emptyDir evicts this pod
      # instead of pushing the node into DiskPressure.
      extraVolumes:
        - name: docker-graph-storage
          emptyDir:
            sizeLimit: 20Gi
        - name: dind-subids
          configMap:
            name: gitea-actions-dind-subids

      runner:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        # act_runner bind-mounts docker_host into job containers, and the DinD
        # daemon resolves that path in its own filesystem, where the rootless
        # socket lives under /run/user/1000. Mounting the chart's docker-socket
        # emptyDir as a directory also survives a DinD restart; the chart's
        # subPath mount of docker.sock keeps pointing at the old socket.
        extraVolumeMounts:
          - name: docker-socket
            mountPath: /run/user/1000
        extraEnvs:
          - name: DOCKER_HOST
            value: unix:///run/user/1000/docker.sock
        config: |
          log:
            level: info
          runner:
            capacity: 2
            labels:
              - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"
              - "ubuntu-24.04:docker://docker.gitea.com/runner-images:ubuntu-24.04"
              - "ubuntu-22.04:docker://docker.gitea.com/runner-images:ubuntu-22.04"
          cache:
            # Per-job docker networks can't reach the auto-detected cache address.
            enabled: false
          container:
            require_docker: true
            docker_timeout: 300s
            docker_host: unix:///run/user/1000/docker.sock
            # Both are the defaults, written out so a change is a visible
            # decision: no job container may run privileged or mount a
            # path from the DinD host.
            privileged: false
            valid_volumes: []

      # Rootless: dockerd runs as uid 1000 inside the pod's own user namespace,
      # so a job's root is an unprivileged uid on the node. The chart still sets
      # privileged; under hostUsers: false that only grants rights inside the
      # pod's namespace. Rootless networking needs /dev/net/tun, which only
      # privileged gives a user-namespaced pod. See README.md.
      dind:
        rootless: true
        uid: 1000
        tag: 29.9.2-dind-rootless
        # Unix socket only. The entrypoint adds TCP listeners (2375 without TLS
        # when DOCKER_TLS_CERTDIR is empty) unless the first arg is `dockerd`;
        # it still wraps that in rootlesskit.
        extraArgs:
          - dockerd
          - --host=unix:///run/user/1000/docker.sock
        # Jobs are IPv4 only: slirp4netns gives no IPv6 default route and the
        # image has no pasta (homeops-project#162).
        extraEnvs:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        extraVolumeMounts:
          # The parent of the docker dir: rootlesskit must own .../docker
          # itself, and can't chown a mount point.
          - name: docker-graph-storage
            mountPath: /home/rootless/.local/share
          - name: dind-subids
            mountPath: /etc/subuid
            subPath: subuid
          - name: dind-subids
            mountPath: /etc/subgid
            subPath: subgid
        # Also the ceiling for job containers. Rootless dockerd runs without
        # cgroups, so there are no per-job limits, only this one.
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 6Gi
