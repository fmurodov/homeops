---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# The runner never talks to the Kubernetes API. Without its own account the pod
# gets the namespace's default one, with a token mounted where every job (via
# the privileged DinD sidecar) could read it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-actions-runner
automountServiceAccountToken: false
