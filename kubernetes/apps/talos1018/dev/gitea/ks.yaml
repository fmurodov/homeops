---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# gitea - Self-hosted git server
# PREREQUISITE: Register a Gitea OIDC app in Pocket ID before deploying.
#   Redirect URI: https://gitea.<CLUSTER_DOMAIN>/user/oauth2/Pocket%20ID/callback
#   Then fill username/password/key/secret into gitea-secret.sops.yaml
#   and encrypt it with: sops --encrypt --in-place gitea/app/gitea-secret.sops.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-longhorn-config
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/talos1018/dev/gitea/app
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gitea
      namespace: dev
