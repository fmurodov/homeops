---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Smart Home
    gethomepage.dev/icon: home-assistant
    gethomepage.dev/name: Home Assistant
    gethomepage.dev/app: home-assistant
spec:
  parentRefs:
    - name: main-gateway
      namespace: network
      sectionName: https-internal
    - name: main-gateway
      namespace: network
      sectionName: https-external
  hostnames:
    - "hass.${CLUSTER_DOMAIN}"
    - "hass.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: home-assistant
          port: 8123
