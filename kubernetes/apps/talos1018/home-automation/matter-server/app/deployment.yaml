---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
      annotations:
        k8s.v1.cni.cncf.io/networks: network/multus-macvlan2
    spec:
      automountServiceAccountToken: false
      # Otherwise the "matter-server" Service injects MATTER_SERVER_* variables.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.5.2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              add:
                - NET_RAW
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: MATTER_SERVER__INSTANCE_NAME
              value: matter-server
            - name: DISABLE_DASHBOARD
              value: "false"
            - name: PRODUCTION_MODE
              value: "true"
            - name: BLE_PROXY
              value: "true"
            - name: ENABLE_TIME_SYNC
              value: "true"
          # TCP, not HTTP: /ws hangs plain GETs and / answers 200 even when the
          # WebSocket server is stuck, so neither proves the API is alive.
          # Loading ~35 Matter nodes from disk takes a while; the startup probe
          # holds liveness off until the listener is up.
          startupProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
