---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      version: 5.0.1
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      matter-server:
        type: statefulset
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.4.0
            env:
              TZ: ${TIMEZONE}
              MATTER_SERVER__INSTANCE_NAME: "{{ .Release.Name }}"
              DISABLE_DASHBOARD: false
              PRODUCTION_MODE: "true"
              BLE_PROXY: "true"
              ENABLE_TIME_SYNC: "true"
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              capabilities:
                add:
                  - NET_RAW
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            probes:
              # TCP, not HTTP: /ws hangs plain GETs and / answers 200 even when the
              # WebSocket server is stuck, so neither proves the API is alive.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5580
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5580
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Loading ~35 Matter nodes from disk takes a while; hold liveness off
              # until the listener is up rather than restarting mid-boot.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5580
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 384Mi
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: network/multus-macvlan2
    service:
      app:
        controller: matter-server
        ports:
          websocket:
            enabled: true
            port: 5580
    persistence:
      config:
        enabled: true
        existingClaim: matter-server-data
        globalMounts:
          - path: /data
