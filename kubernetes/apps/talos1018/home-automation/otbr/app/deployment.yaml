---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr-1
  labels:
    app.kubernetes.io/name: otbr-1
spec:
  replicas: 1
  # RWO volume, and the dongle's serial port takes a single owner: a surge pod
  # on the same node would fight the old one for it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otbr-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otbr-1
      annotations:
        # -router: same VLAN, with IPv6 forwarding enabled in the pod netns
        k8s.v1.cni.cncf.io/networks: network/multus-macvlan2-router
    spec:
      automountServiceAccountToken: false
      # Otherwise the "otbr-1"/"otbr-3" Services inject OTBR_* variables.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: talos-1018-1
      containers:
        - name: otbr
          image: openthread/border-router:v2026.11.0
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - name: rest
              containerPort: 8081
              protocol: TCP
            - name: web
              containerPort: 8080
              protocol: TCP
          env:
            # Sonoff Dongle-PMG24 does not have RTS/CTS wired — no hardware flow control
            - name: OT_RCP_DEVICE
              value: "spinel+hdlc+uart:///dev/thread0?uart-baudrate=460800"
            - name: OT_INFRA_IF
              value: "net1"
            - name: OT_THREAD_IF
              value: "wpan0"
            - name: OT_REST_LISTEN_ADDR
              value: "::"
            - name: OT_REST_LISTEN_PORT
              value: "8081"
            - name: OT_WEB_LISTEN_ADDR
              value: "::"
            - name: OT_WEB_LISTEN_PORT
              value: "8080"
            - name: OT_LOG_LEVEL
              value: "4"
          livenessProbe:
            exec:
              # ot-ctl returns empty output on ~8% of calls, so retry
              # before reporting a failure.
              command:
                - /bin/sh
                - -c
                - |
                  for i in 1 2 3; do
                    A=$(ot-ctl ipaddr rloc | head -1 | tr -d '\r' | sed 's/:[^:]*$/:fc00/')
                    case "$A" in *:fc00)
                      ot-ctl neighbor list | grep -q 0x &&
                      ot-ctl ping "$A" 16 3 | grep -q "[1-3] packets received" && exit 0 ;;
                    esac
                    sleep 2
                  done
                  exit 1
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 25
            failureThreshold: 10
          # REST only: the radio check above is too slow to run every 30s
          readinessProbe:
            tcpSocket:
              port: rest
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: thread-dongle
              mountPath: /dev/thread0
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otbr-data-1
        - name: thread-dongle
          hostPath:
            path: /dev/thread0
            # Untyped, kubelet creates a directory here whenever the udev symlink is
            # briefly absent, which then blocks udev from ever recreating it.
            type: CharDevice
        - name: tun
          hostPath:
            path: /dev/net/tun
---
