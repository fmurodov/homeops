---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
spec:
  secretName: mosquitto-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "mqtt.${CLUSTER_DOMAIN}"
