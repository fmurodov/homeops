---
# Envoy access logs for Gateways on the `cilium` GatewayClass. Cilium turns
# this into an Envoy access_log and ships it over xDS, so the lines appear on
# cilium-envoy's stdout — already tailed by fluent-bit — without a restart.
#
# Also the Service settings for the `cilium` class (internal-gateway).
# Leave ipFamilies/ipFamilyPolicy unset here: Cilium's default is IPv4-primary
# dual stack, and the API rejects a change of the primary family in place.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: gateway-access-logs
  namespace: kube-system
spec:
  service:
    # The LB IPs and the node-local Envoy carry all gateway traffic.
    allocateLoadBalancerNodePorts: false
  telemetry:
    accessLogs:
      # TCP would need a second entry; every listener here terminates TLS.
      - format: JSON
        targets:
          - HTTP
        json:
          # Istio's canonical Envoy schema, so the fields match what Envoy
          # runbooks and dashboards describe. Only %CILIUM_GATEWAY_*% is
          # Cilium's; everything else reaches Envoy verbatim.
          start_time: "%START_TIME%"
          route_name: "%ROUTE_NAME%"
          method: "%REQ(:METHOD)%"
          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
          protocol: "%PROTOCOL%"
          response_code: "%RESPONSE_CODE%"
          response_flags: "%RESPONSE_FLAGS%"
          response_code_details: "%RESPONSE_CODE_DETAILS%"
          connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
          bytes_received: "%BYTES_RECEIVED%"
          bytes_sent: "%BYTES_SENT%"
          duration: "%DURATION%"
          upstream_service_time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
          x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
          user_agent: "%REQ(USER-AGENT)%"
          request_id: "%REQ(X-REQUEST-ID)%"
          authority: "%REQ(:AUTHORITY)%"
          upstream_host: "%UPSTREAM_HOST%"
          upstream_cluster: "%UPSTREAM_CLUSTER%"
          upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
          downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
          downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
          requested_server_name: "%REQUESTED_SERVER_NAME%"
          upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"

          # Beyond the standard schema.
          gateway: "%CILIUM_GATEWAY_NAMESPACE%/%CILIUM_GATEWAY_NAME%"
          # Cloudflare's header exists only for tunnelled traffic; the fallback
          # covers clients reaching a listener directly over split DNS.
          client_ip: "%REQ(CF-CONNECTING-IP?X-FORWARDED-FOR)%"
          # Null for those direct clients, so this doubles as the
          # tunnelled-vs-direct flag.
          client_country: "%REQ(CF-IPCOUNTRY)%"
---
# IPv6-only gateways (dn42-gateway). spec.telemetry is copied from
# gateway-access-logs by the replacement in kustomization.yaml.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: gateway-ipv6-only
  namespace: kube-system
spec:
  service:
    ipFamilyPolicy: SingleStack
    ipFamilies:
      - IPv6
    allocateLoadBalancerNodePorts: false
  telemetry: {}
---
# Not Helm-owned like `cilium`: deleting this class tears down the Service of
# every Gateway on it.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-ipv6-only
spec:
  controllerName: io.cilium/gateway-controller
  description: Cilium gateways with an IPv6-only LoadBalancer Service
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: gateway-ipv6-only
    namespace: kube-system
---
# Tunnel-only gateways (internet-gateway): reachable only on their ClusterIP,
# which is all cloudflared needs. Cilium can't make a gateway Service of type
# ClusterIP, so this sets a loadBalancerClass that no controller handles:
# LB-IPAM skips it, the Service gets no external IP, and the Gateway reports
# Programmed=False (AddressNotAssigned) while its listeners serve normally.
# The config must exist before a Gateway's Service is first created:
# loadBalancerClass is immutable and the operator keeps whatever the Service
# was created with. If the class is ever missing, delete the Service once.
# The same goes for ipFamilies.
# spec.telemetry is copied from gateway-access-logs by the replacement in
# kustomization.yaml.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: gateway-cluster-only
  namespace: kube-system
spec:
  service:
    loadBalancerClass: homeops/cluster-only
    # cloudflared would pick the IPv4 ClusterIP over a ULA one (RFC 6724).
    ipFamilyPolicy: SingleStack
    ipFamilies:
      - IPv6
    allocateLoadBalancerNodePorts: false
  telemetry: {}
---
# Not Helm-owned like `cilium`: deleting this class tears down the Service of
# every Gateway on it.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-cluster-only
spec:
  controllerName: io.cilium/gateway-controller
  description: Cilium gateways with no external address
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: gateway-cluster-only
    namespace: kube-system
