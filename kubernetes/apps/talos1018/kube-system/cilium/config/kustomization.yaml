---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./l2-announcement-policy.yaml
  - ./internal-pool.yaml
  - ./external-pool.yaml
  - ./dn42-pool.yaml
  - ./gatewayclassconfig.yaml
replacements:
  - source:
      kind: CiliumGatewayClassConfig
      name: gateway-access-logs
      fieldPath: spec.telemetry
    targets:
      - select:
          kind: CiliumGatewayClassConfig
          name: gateway-ipv6-only
        fieldPaths:
          - spec.telemetry
