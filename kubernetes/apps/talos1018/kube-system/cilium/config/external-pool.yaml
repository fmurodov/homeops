# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2.json
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: external-pool
spec:
  blocks:
    # IPV6_PREFIX_GUA is the site /48; :5 is the SRV VLAN the nodes sit on.
    - cidr: "${IPV6_PREFIX_GUA}:5:2000::/96"
    - start: "10.18.6.10"
      stop: "10.18.6.39"

  serviceSelector:
    matchLabels:
      service.kubernetes.io/topology: external
