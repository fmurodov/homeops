---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Cilium CNI - Controller (Helm deployment)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/kube-system/cilium/app
  prune: true
  # Losing this object must not take the CNI down with it.
  deletionPolicy: Orphan
  wait: true
---
# Cilium CNI - Config (CRDs - depends on controller)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-config
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/kube-system/cilium/config
  prune: true
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
