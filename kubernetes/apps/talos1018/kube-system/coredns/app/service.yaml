---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
spec:
  # The .10 of the IPv6 serviceSubnet, matching kubelet clusterDNS in the
  # Talos patch. IPv6 only, so pods get one nameserver (homeops-project#162).
  clusterIP: fd00:1018:2000::a
  clusterIPs:
    - fd00:1018:2000::a
  ipFamilies:
    - IPv6
  ipFamilyPolicy: SingleStack
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: metrics
      port: 9153
      protocol: TCP
      targetPort: 9153
