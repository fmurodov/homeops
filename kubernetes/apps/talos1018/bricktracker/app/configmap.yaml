---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: ConfigMap
metadata:
  name: bricktracker-config
  labels:
    app: bricktracker
data:
  TZ: "${TIMEZONE}"
  BK_TIMEZONE: "${TIMEZONE}"
  # All data (db, CSVs, images) lives under /app/data by default (BrickTracker
  # data consolidation, 1.3+). A single volume at /app/data covers everything,
  # so the *_PATH / *_FOLDER defaults are left untouched.
  BK_REBRICKABLE_LINKS: "true"
  BK_BRICKLINK_LINKS: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
