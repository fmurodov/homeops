# Authoritative only: no recursion, and zone transfers are refused (no acl).
# Zone files come from git (read-only); Knot keeps journal, timers and
# DNSSEC keys in /storage.
server:
  listen: ::@1053
  rundir: /rundir

database:
  storage: /storage

log:
  - target: stdout
    any: info

template:
  - id: default
    storage: /zones
    # Never write back to the read-only zone files; serials come from Knot
    zonefile-sync: -1
    zonefile-load: difference-no-serial
    journal-content: all
    serial-policy: unixtime
    semantic-checks: on
    # Default policy: ECDSA P-256, ZSK rolled automatically, KSK never.
    # The KSK's DS goes into the dn42 registry by hand.
    dnssec-signing: on

zone:
  - domain: fmurodov.dn42
  - domain: 3.c.d.d.e.f.e.c.d.6.d.f.ip6.arpa
