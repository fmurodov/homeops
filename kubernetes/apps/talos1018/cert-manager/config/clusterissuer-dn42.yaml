---
# Burble's ACME for DN42 (https://burble.dn42/services/acme/): 30-day certificates
# under the dn42 root, names in .dn42 only (root name constraints), no EAB.
# Reached over DN42 (pods masquerade to the node's fd6d address; cluster DNS
# forwards .dn42 to dn42-resolver).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: dn42
spec:
  acme:
    server: https://acme.burble.dn42/v1/dn42/acme/directory
    # dn42 Root Authority CA, the only CA the ACME server's TLS chains to.
    # Copied from the dn42 wiki repo and https://ca.dn42.us/crt/root-ca.crt
    # (identical). SHA-256 7C:16:2C:DA:B7:CB:97:E9:8C:60:C0:04:EB:36:D7:4E:
    # 7B:EC:0D:7F:EB:20:AB:59:BC:9E:99:65:8B:62:D3:E7, valid until 2030-12-31.
    caBundle: 
    privateKeySecretRef:
      name: dn42-acme-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: dn42-gateway
                namespace: network
                sectionName: http
