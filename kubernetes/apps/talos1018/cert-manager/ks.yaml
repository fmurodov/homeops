---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# cert-manager - Controller (Helm deployment with CRDs)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cert-manager-app
  namespace: flux-system
  annotations:
    # Moving into the apps parent (docs/infra-into-apps.md): the old parent
    # must not garbage-collect this object, and if it is ever deleted it
    # must not take its workloads with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
    - name: gateway-api-app
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/cert-manager/app
  prune: true
  deletionPolicy: Orphan
  wait: true
---
# cert-manager - Config (ClusterIssuers and secrets)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cert-manager-config
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infra-cert-manager-app
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/cert-manager/config
  prune: true
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
