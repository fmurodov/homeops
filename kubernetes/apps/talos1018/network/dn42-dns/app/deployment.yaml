---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dn42-dns
  labels:
    app.kubernetes.io/name: dn42-dns
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dn42-dns
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dn42-dns
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Upstream queries must leave from the node's fd6d:cefe:ddc3:5:: address:
      # rock64 only lets home dn42 prefixes in, and pod IPv6 stops being
      # masqueraded once pods get GUA addresses (#113).
      hostNetwork: true
      dnsPolicy: Default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: dn42-dns
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.15.0
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
            - name: metrics
              containerPort: 9154
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8153
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8154
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dn42-dns
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dn42-dns
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dn42-dns
