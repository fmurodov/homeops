---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: dn42-dns
  labels:
    app.kubernetes.io/name: dn42-dns
    service.kubernetes.io/topology: internal
  annotations:
    # ::53 / .53 for DNS; UniFi forwards the dn42 zones here
    io.cilium/lb-ipam-ips: "fd6d:cefe:ddc3:5:3000::53,10.18.6.53"
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ports:
    - name: dns
      port: 53
      targetPort: 1053
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 1053
      protocol: TCP
  selector:
    app.kubernetes.io/name: dn42-dns
