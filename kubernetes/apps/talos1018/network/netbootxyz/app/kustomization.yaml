---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
resources:
  - deployment.yaml
  - service.yaml
  - oauth2-proxy-secret.sops.yaml
  - httproute.yaml
  - udproute.yaml
components:
  - ../../../../../components/oauth2-proxy
configMapGenerator:
  - name: oauth2-proxy
    literals:
      - OAUTH2_PROXY_UPSTREAMS=http://netbootxyz:3000
      - OAUTH2_PROXY_REDIRECT_URL=https://netbootxyz.${CLUSTER_DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_netbootxyz
