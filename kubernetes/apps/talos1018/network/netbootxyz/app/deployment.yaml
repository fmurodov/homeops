---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbootxyz
  labels:
    app.kubernetes.io/name: netbootxyz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbootxyz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbootxyz
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: netbootxyz
          image: ghcr.io/netbootxyz/netbootxyz:0.7.6-nbxyz10
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: MENU_VERSION
              # renovate: datasource=github-releases depName=netbootxyz/netboot.xyz
              value: 3.0.3
            # Keeps transfers on port 69 so the gateway can proxy them.
            - name: TFTPD_OPTS
              value: --tftp-single-port
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: http-assets
              containerPort: 80
              protocol: TCP
            - name: tftp
              containerPort: 69
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: "0.2"
              memory: "512Mi"
            requests:
              cpu: "0.002"
              memory: "128Mi"
