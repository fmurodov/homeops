---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# multus-macvlan2 for pods that route rather than terminate traffic. Upstream
# enables forwarding in setup-host, which never runs in a pod netns — without it
# the border router advertises routes into the mesh and then drops the traffic.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: multus-macvlan2-router
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "multus-macvlan2-router",
      "plugins": [
        {
          "type": "macvlan",
          "master": "net0.2",
          "mode": "bridge"
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.IFNAME.accept_ra": "2",
            "net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen": "128",
            "net.ipv6.conf.all.forwarding": "1",
            "net.ipv6.conf.IFNAME.forwarding": "1",
            "net.ipv6.conf.IFNAME.accept_ra_defrtr": "0"
          }
        }
      ]
    }
