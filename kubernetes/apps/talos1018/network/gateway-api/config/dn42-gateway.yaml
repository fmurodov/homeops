---
# The only thing DN42 peers may reach (rock64 dn42-fw opens it per port).
# IPv6 only: DN42 here is IPv6 only and dn42-pool has no IPv4 block.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dn42-gateway
  annotations:
    # dn42 ACME CA, HTTP-01 over this gateway's http listener
    cert-manager.io/cluster-issuer: dn42
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: "fd6d:cefe:ddc3:5:4000::1"
    labels:
      service.kubernetes.io/topology: dn42
  listeners:
    # Also serves the dn42 ACME HTTP-01 challenges.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # One listener (and certificate) per name: HTTP-01 can't issue wildcards.
    - name: https-fmurodov
      hostname: fmurodov.dn42
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: dn42-gateway-fmurodov-tls
      allowedRoutes:
        namespaces:
          from: All
