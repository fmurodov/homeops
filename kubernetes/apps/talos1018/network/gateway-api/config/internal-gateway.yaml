---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: "fd00:1018:0:5:3000::45,10.18.6.45"
    labels:
      service.kubernetes.io/topology: internal
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-internal
      hostname: "*.${CLUSTER_DOMAIN}"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          # Own secret: gateway-shim can't share one Certificate across Gateways.
          - name: internal-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
    - name: tftp
      protocol: UDP
      port: 69
      allowedRoutes:
        namespaces:
          from: All
