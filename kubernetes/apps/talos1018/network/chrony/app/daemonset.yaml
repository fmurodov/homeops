---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chrony
  labels:
    app.kubernetes.io/name: chrony
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chrony
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrony
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9123"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: chrony
          image: dockurr/chrony:4.9@sha256:f584829f268b26b26b351000b60aa7c3507933873b6a6d77ffe9dcabcfdc7025
          env:
            - name: TZ
              value: "Etc/UTC"
            # NTS applies to every hostname source, so each one must support NTS-KE
            - name: ENABLE_NTS
              value: "true"
            - name: NTP_SERVERS
              value: >-
                time.cloudflare.com,nts.time.nl,nts.netnod.se,ptbtime1.ptb.de
          resources:
            limits:
              cpu: "0.2"
              memory: "50Mi"
            requests:
              cpu: "0.05"
              memory: "10Mi"
          ports:
            - containerPort: 123
              protocol: UDP
          volumeMounts:
            - name: run
              mountPath: /run/chrony
        # The clients collector needs chronyd's command socket, not UDP 323.
        # The exporter binds its reply socket next to chronyd.sock, so it runs
        # as the image's chrony user (uid 100) to write into /run/chrony (0750).
        - name: chrony-exporter
          image: quay.io/superq/chrony-exporter:v0.15.0@sha256:43483aa041e874b9e6ba28bbe48c77177afcc068e5271ec87e50d3e05dd49b60
          args:
            - --chrony.address=unix:///run/chrony/chronyd.sock
            - --collector.sources
            - --collector.sourcestats
            - --collector.serverstats
            - --collector.clients
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: "64Mi"
            requests:
              cpu: "0.01"
              memory: "16Mi"
          ports:
            - name: metrics
              containerPort: 9123
              protocol: TCP
          volumeMounts:
            - name: run
              mountPath: /run/chrony
      volumes:
        - name: run
          emptyDir: {}
