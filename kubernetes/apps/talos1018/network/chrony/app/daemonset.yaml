---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chrony
  labels:
    app.kubernetes.io/name: chrony
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chrony
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrony
    spec:
      containers:
        - name: chrony
          image: dockurr/chrony:4.9
          env:
            - name: TZ
              value: "Etc/UTC"
            # NTS applies to every hostname source, so each one must support NTS-KE
            - name: ENABLE_NTS
              value: "true"
            - name: NTP_SERVERS
              value: >-
                time.cloudflare.com,nts.time.nl,nts.netnod.se,ptbtime1.ptb.de
          resources:
            limits:
              cpu: "0.2"
              memory: "50Mi"
            requests:
              cpu: "0.05"
              memory: "10Mi"
          ports:
            - containerPort: 123
              protocol: UDP
