---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: potato-mesh
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: mdi-radio-tower
    gethomepage.dev/name: PotatoMesh
    gethomepage.dev/app: potato-mesh-web
    gethomepage.dev/description: MeshCore map and nodes
spec:
  parentRefs:
    - name: internal-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "potato-mesh.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: oauth2-proxy
          port: 4180
