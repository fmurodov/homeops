---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# potato-mesh - MeshCore map and node dashboard, fed by a USB companion radio on talos-1018-2
# PREREQUISITES:
#   - Pocket ID OIDC client with callback https://potato-mesh.<cluster domain>/oauth2/callback
#   - explicit DNS record for potato-mesh on the internal gateway (fmurodov-tf)
#   - fill both *-secret.sops.yaml files, then encrypt them
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: potato-mesh
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: longhorn-config
      namespace: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/potato-mesh/app
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
