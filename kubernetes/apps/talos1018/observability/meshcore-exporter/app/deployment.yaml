---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcore-exporter
  labels:
    app.kubernetes.io/name: meshcore-exporter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # The serial port takes a single owner: a surge pod would fight the old one for it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meshcore-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meshcore-exporter
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The repeater is USB-powered from this node.
      nodeSelector:
        kubernetes.io/hostname: talos-1018-2
      containers:
        - name: exporter
          image: python:3.15-alpine
          command: ["python3", "-I", "/opt/exporter/meshcore_exporter.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          # The device cgroup blocks host devices for unprivileged containers,
          # and ttyACM0 is root-only 0600.
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 9842
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /opt/exporter
              readOnly: true
            - name: repeater
              mountPath: /dev/meshcore
      volumes:
        - name: script
          configMap:
            name: meshcore-exporter
        - name: repeater
          hostPath:
            path: /dev/serial/by-id/usb-Raspberry_Pi_Pico_W_E6632C8593276C30-if00
            # Untyped, kubelet creates a directory here whenever the udev symlink is
            # briefly absent, which then blocks udev from ever recreating it.
            type: CharDevice
