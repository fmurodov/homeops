---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ./helmrepository.yaml
  - ./pvc.yaml
  - ./grafana-secret.sops.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
configMapGenerator:
  - name: grafana-dashboards-custom
    files:
      - dashboards/victorialogs-explorer.json
      - dashboards/gateway-access-logs.json
    options:
      disableNameSuffixHash: true
      # Grafana's own $var refs would otherwise be eaten by Flux envsubst.
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
