---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert
spec:
  chart:
    spec:
      chart: victoria-metrics-alert
      sourceRef:
        kind: HelmRepository
        name: vm
  interval: 1h0m0s
  values:
    server:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8880"
      extraArgs:
        httpListenAddr: "[::]:8880"
        enableTCP6: "true"
        # Alert "Source" links point at the real UI, not the pod hostname
        external.url: "https://vmalert.${CLUSTER_DOMAIN}"
      datasource:
        url: http://victoria-metrics-victoria-metrics-single-server:8428
      remote:
        write:
          url: http://victoria-metrics-victoria-metrics-single-server:8428
      notifier:
        alertmanager:
          url: http://alertmanager:9093
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      service:
        clusterIP: ""
      # Alert rules evaluated by vmalert
      config:
        alerts:
          groups:
            # ----------------------------------------------------------------
            # Watchdog — always firing. Routed by Alertmanager to healthchecks.io
            # as a dead-man's-switch: if this stops arriving, the whole pipeline
            # (scrape → vmalert → alertmanager → egress) is broken.
            # ----------------------------------------------------------------
            - name: watchdog
              rules:
                - alert: Watchdog
                  expr: vector(1)
                  labels:
                    severity: none
                  annotations:
                    summary: "Alerting pipeline is alive"

            # ----------------------------------------------------------------
            # Daily heartbeat — a dead-man's-switch you actually see. Fires
            # for ~5 min once a day so a real notification lands in the muted
            # Discord #heartbeat channel; if the morning ping stops, delivery
            # is broken. Alertmanager routes it by alertname, ahead of the
            # severity="critical" route, so it never pages.
            # hour()/minute() are UTC (vmalert has no timezone), so this is
            # pinned to 07:00 UTC = 09:00 CEST (summer) / 08:00 CET (winter).
            # ----------------------------------------------------------------
            - name: heartbeat
              rules:
                - alert: DailyHeartbeat
                  expr: hour() == 7 and minute() < 5
                  labels:
                    severity: critical
                  annotations:
                    summary: "Daily alerting heartbeat — notification delivery is working"

            # ----------------------------------------------------------------
            # Nodes
            # ----------------------------------------------------------------
            - name: node
              rules:
                # Sourced from kube-state-metrics (a healthy node), so it fires
                # reliably even when the down node itself can't be scraped.
                - alert: NodeDown
                  expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Node {{ $labels.node }} is NotReady"

                - alert: NodeHighCPU
                  expr: '1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Node {{ $labels.instance }} CPU usage above 85%"

                - alert: NodeHighMemory
                  expr: '(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Node {{ $labels.instance }} memory usage above 85%"

                - alert: NodeDiskSpaceLow
                  expr: '(node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_free_bytes{fstype!~"tmpfs|overlay"}) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} > 0.85'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Node {{ $labels.instance }} disk {{ $labels.mountpoint }} usage above 85%"

                # Extrapolate free space; fires if a filesystem trends to full within 24h
                - alert: NodeDiskWillFillIn24h
                  expr: 'predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0'
                  for: 1h
                  labels:
                    severity: warning
                  annotations:
                    summary: "Node {{ $labels.instance }} disk {{ $labels.mountpoint }} predicted to fill within 24h"

                - alert: NodeInodesLow
                  expr: 'node_filesystem_files_free{fstype!~"tmpfs|overlay"} / node_filesystem_files{fstype!~"tmpfs|overlay"} < 0.10'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Node {{ $labels.instance }} inodes on {{ $labels.mountpoint }} below 10%"

                - alert: NodeHighLoad
                  expr: 'node_load15 / count by (instance) (node_cpu_seconds_total{mode="idle"}) > 2'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Node {{ $labels.instance }} 15m load is more than 2x core count"

                - alert: NodeClockSkew
                  expr: 'abs(node_timex_offset_seconds) > 0.05'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Node {{ $labels.instance }} clock is skewed by more than 50ms"

            # ----------------------------------------------------------------
            # Kubernetes workloads (kube-state-metrics)
            # ----------------------------------------------------------------
            - name: kubernetes-workloads
              rules:
                - alert: KubePodCrashLooping
                  expr: 'increase(kube_pod_container_status_restarts_total[15m]) > 3'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is crash looping"

                - alert: KubePodNotReady
                  expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been non-ready for 15m"

                - alert: KubeContainerOOMKilled
                  expr: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1'
                  for: 1m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled"

                - alert: KubeContainerWaiting
                  expr: 'sum by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason!~"ContainerCreating|PodInitializing"}) > 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} stuck waiting ({{ $labels.reason }})"

                # Below desired but still serving → warning
                - alert: KubeDeploymentReplicasMismatch
                  expr: 'kube_deployment_status_replicas_available < kube_deployment_spec_replicas and kube_deployment_status_replicas_available > 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired"

                # Zero available replicas → app is fully down → page
                - alert: KubeDeploymentDown
                  expr: 'kube_deployment_spec_replicas > 0 and kube_deployment_status_replicas_available == 0'
                  for: 15m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has no available replicas"

                - alert: KubeStatefulSetReplicasMismatch
                  expr: 'kube_statefulset_status_replicas_ready < kube_statefulset_replicas and kube_statefulset_status_replicas_ready > 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired"

                - alert: KubeStatefulSetDown
                  expr: 'kube_statefulset_replicas > 0 and kube_statefulset_status_replicas_ready == 0'
                  for: 15m
                  labels:
                    severity: critical
                  annotations:
                    summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has no ready replicas"

                - alert: KubeDaemonSetNotReady
                  expr: 'kube_daemonset_status_number_ready < kube_daemonset_status_desired_number_scheduled'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} is not fully scheduled"

                - alert: KubeJobFailed
                  expr: 'kube_job_status_failed > 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"

            # ----------------------------------------------------------------
            # Storage (kubelet volume stats + Longhorn)
            # ----------------------------------------------------------------
            - name: storage
              rules:
                - alert: KubePersistentVolumeFillingUp
                  expr: 'kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 10% free"

                - alert: KubePersistentVolumeCritical
                  expr: 'kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.03'
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 3% free"

                - alert: KubePVCPending
                  expr: 'kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is stuck Pending"

                # Names/exprs/thresholds track the official Longhorn
                # alert-rules-example (docs archive 1.3.1) so they line up with
                # what the Longhorn UI documents. Thin-provisioned volumes can be
                # near-full at the Longhorn layer while kubelet_volume_stats (the
                # filesystem view behind KubePersistentVolumeFillingUp) still looks
                # fine — this actual-space rule is the only one that catches that.
                - alert: LonghornVolumeActualSpaceUsedWarning
                  expr: '(longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "The actual used space of Longhorn volume is over 90% of the capacity."
                    description: "The actual space used by Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is at {{ $value }}% capacity for more than 5 minutes."

                - alert: LonghornVolumeStatusCritical
                  expr: 'longhorn_volume_robustness == 3'
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Longhorn volume {{ $labels.volume }} is Fault"
                    description: "Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is Fault for more than 2 minutes."

                - alert: LonghornVolumeStatusWarning
                  expr: 'longhorn_volume_robustness == 2'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Longhorn volume {{ $labels.volume }} is Degraded"
                    description: "Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is Degraded for more than 5 minutes."

                - alert: LonghornNodeStorageWarning
                  expr: '(longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "The used storage of node is over 70% of the capacity."
                    description: "The used storage of node {{ $labels.node }} is at {{ $value }}% capacity for more than 5 minutes."

                - alert: LonghornDiskStorageWarning
                  expr: '(longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "The used storage of disk is over 70% of the capacity."
                    description: "The used storage of disk {{ $labels.disk }} on node {{ $labels.node }} is at {{ $value }}% capacity for more than 5 minutes."

                - alert: LonghornNodeDown
                  expr: '(avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0'
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Longhorn nodes is offline"
                    description: "There are {{ $value }} Longhorn nodes which have been offline for more than 5 minutes."

                - alert: LonghornInstanceManagerCPUUsageWarning
                  expr: '(longhorn_instance_manager_cpu_usage_millicpu / longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Longhorn instance manager {{ $labels.instance_manager }} on {{ $labels.node }} has CPU Usage / CPU request is over 300%."
                    description: "Longhorn instance manager {{ $labels.instance_manager }} on {{ $labels.node }} has CPU Usage / CPU request is {{ $value }}% for more than 5 minutes."

                - alert: LonghornNodeCPUUsageWarning
                  expr: '(longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Longhorn node {{ $labels.node }} experiences high CPU pressure for more than 5m."
                    description: "Longhorn node {{ $labels.node }} has CPU Usage / CPU capacity is {{ $value }}% for more than 5 minutes."

                # The daily-backup recurring job runs to completion before its
                # CronJob records success, so last-success time is a heartbeat for
                # "backups finished shipping to B2". 26h ≈ one daily cycle + grace.
                - alert: LonghornBackupStale
                  expr: 'time() - max(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="daily-backup"}) > 26 * 3600'
                  for: 30m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Longhorn daily backup has not completed successfully in over 26h"

                # max() yields nothing when the series is gone, so the staleness
                # rule above can't fire if the CronJob is deleted or KSM stops
                # scraping. absent() catches that full disappearance.
                - alert: LonghornBackupAbsent
                  expr: 'absent(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="daily-backup"})'
                  for: 1h
                  labels:
                    severity: critical
                  annotations:
                    summary: "Longhorn daily backup heartbeat is missing (CronJob or kube-state-metrics gone)"

                # State 4 = Error in Longhorn's backup exporter.
                - alert: LonghornBackupFailed
                  expr: 'longhorn_backup_state == 4'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Longhorn backup {{ $labels.backup }} for volume {{ $labels.volume }} is in Error state"

            # ----------------------------------------------------------------
            # Certificates (cert-manager) — requires cert-manager scraping
            # ----------------------------------------------------------------
            - name: certificates
              rules:
                - alert: CertManagerCertExpiringSoon
                  expr: 'certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 24 * 3600'
                  for: 1h
                  labels:
                    severity: warning
                  annotations:
                    summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 21 days"

                - alert: CertManagerCertExpiringCritical
                  expr: 'certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600'
                  for: 1h
                  labels:
                    severity: critical
                  annotations:
                    summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 7 days"

                - alert: CertManagerCertNotReady
                  expr: 'certmanager_certificate_ready_status{condition="True"} == 0'
                  for: 1h
                  labels:
                    severity: warning
                  annotations:
                    summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready"

            # ----------------------------------------------------------------
            # Control plane (etcd / apiserver / scheduler / controller-manager)
            # requires the Talos control-plane metrics change
            # ----------------------------------------------------------------
            - name: control-plane
              rules:
                - alert: EtcdNoLeader
                  expr: 'etcd_server_has_leader == 0'
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "etcd member {{ $labels.instance }} has no leader"

                - alert: EtcdHighLeaderChanges
                  expr: 'increase(etcd_server_leader_changes_seen_total[15m]) > 3'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "etcd has had more than 3 leader changes in 15m"

                - alert: EtcdHighFsyncLatency
                  expr: 'histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > 0.5'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "etcd WAL fsync p99 latency on {{ $labels.instance }} above 500ms"

                - alert: EtcdHighCommitLatency
                  expr: 'histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))) > 0.25'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "etcd backend commit p99 latency on {{ $labels.instance }} above 250ms"

                - alert: KubeAPIServerHighErrorRate
                  expr: 'sum(rate(apiserver_request_total{job="kubernetes-api-server",code=~"5.."}[5m])) / sum(rate(apiserver_request_total{job="kubernetes-api-server"}[5m])) > 0.05'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "API server 5xx error rate above 5%"

                # sum()==0 fires only when every scraped instance is down (not a
                # single node rebooting), and yields nothing when unscraped.
                - alert: KubeSchedulerDown
                  expr: 'sum(up{job="kube-scheduler"}) == 0'
                  for: 10m
                  labels:
                    severity: critical
                  annotations:
                    summary: "All kube-scheduler instances are down"

                - alert: KubeControllerManagerDown
                  expr: 'sum(up{job="kube-controller-manager"}) == 0'
                  for: 10m
                  labels:
                    severity: critical
                  annotations:
                    summary: "All kube-controller-manager instances are down"

            # ----------------------------------------------------------------
            # CoreDNS — requires coredns scraping
            # ----------------------------------------------------------------
            - name: coredns
              rules:
                - alert: CoreDNSDown
                  expr: 'up{job="coredns"} == 0'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "CoreDNS instance {{ $labels.instance }} is down"

                - alert: CoreDNSHighServfail
                  expr: 'sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m])) / sum(rate(coredns_dns_responses_total[5m])) > 0.05'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "CoreDNS SERVFAIL rate above 5%"

            # ----------------------------------------------------------------
            # Observability self-monitoring
            # ----------------------------------------------------------------
            - name: observability
              rules:
                - alert: TargetDown
                  expr: 'up{job=~"kubernetes-api-server|kubernetes-kubelet|kube-state-metrics|node-exporter|longhorn|home-assistant"} == 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Scrape target {{ $labels.job }} / {{ $labels.instance }} is down"

                - alert: VMLowDiskSpace
                  expr: 'vm_free_disk_space_bytes < 2e9'
                  for: 10m
                  labels:
                    severity: critical
                  annotations:
                    summary: "VictoriaMetrics has less than 2GB free disk on {{ $labels.instance }}"

                - alert: AlertmanagerNotificationsFailing
                  expr: 'rate(alertmanager_notifications_failed_total[10m]) > 0'
                  for: 15m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Alertmanager is failing to deliver notifications ({{ $labels.integration }})"

                - alert: FluentBitOutputErrors
                  expr: 'rate(fluentbit_output_errors_total[10m]) > 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "fluent-bit is failing to ship logs"

            # ----------------------------------------------------------------
            # Ingress / Cloudflare tunnel
            # ----------------------------------------------------------------
            - name: tunnel
              rules:
                - alert: CloudflaredTunnelDown
                  expr: 'cloudflared_tunnel_ha_connections == 0'
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Cloudflare tunnel has no active edge connections"

                # The tunnel is up but cannot reach the gateway behind it —
                # a different failure from the one above, and invisible to it.
                # Clients cancelling SSE streams count as origin errors too, so
                # this sits above that noise floor: it peaks at 0.013/s over a
                # week, while a real outage tracks the request rate (~2/s).
                - alert: CloudflaredOriginErrors
                  expr: 'rate(cloudflared_tunnel_request_errors[10m]) > 0.1'
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Cloudflare tunnel is failing to proxy to the origin"

                # The gauge is only ever set when the edge pushes a config, so
                # anything above 0 means the tunnel went back to being remotely
                # managed and the mounted config.yaml is being ignored again.
                - alert: CloudflaredRemotelyManaged
                  expr: 'cloudflared_orchestration_config_version > 0'
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Cloudflare tunnel is taking config from the dashboard, not git"

            # ----------------------------------------------------------------
            # RIPE Database NRTMv3 probe (nrtm-check CronJob, every 5m)
            # ----------------------------------------------------------------
            - name: whois-nrtm
              rules:
                # The probe pushes success=0 on any logical failure (mirroring
                # disabled, missing %START/%END markers, NRTM port unreachable).
                # 15m ≈ 3 consecutive failures — rides out transient RIPE blips.
                - alert: NrtmCheckFailing
                  expr: 'nrtm_check_success == 0'
                  for: 15m
                  labels:
                    severity: critical
                  annotations:
                    summary: "RIPE NRTMv3 check for {{ $labels.source }} is failing"

                # No sample for 20m → the CronJob isn't running or can't reach VM.
                # absent() catches full disappearance that `== 0` cannot: a stale
                # series simply drops out of instant queries.
                - alert: NrtmCheckAbsent
                  expr: 'absent(nrtm_check_success{source="RIPE"})'
                  for: 20m
                  labels:
                    severity: critical
                  annotations:
                    summary: "RIPE NRTMv3 check has reported no data for over 20m"

            # ----------------------------------------------------------------
            # Thread border routers
            # ----------------------------------------------------------------
            - name: thread
              rules:
                # Baseline is a few RCP crashes/day (SL-OT 2.4.4 firmware bug);
                # the radio-TX liveness probe also lands here. A burst = mesh churn.
                - alert: OtbrRestartStorm
                  expr: 'increase(kube_pod_container_status_restarts_total{namespace="home-automation", pod=~"otbr-.*"}[1h]) > 2'
                  labels:
                    severity: warning
                  annotations:
                    summary: "OTBR {{ $labels.pod }} restarted more than twice in the last hour"

                # Each Matter node exposes exactly one update.*_firmware entity, so this
                # counts devices, not entities. Baseline offline (dead batteries,
                # wall-switched lamps) is ~1/3 of the fleet — 50% means a real outage.
                - alert: MatterDevicesUnavailable
                  expr: >-
                    (
                      count(homeassistant_entity_available{domain="update", entity=~".*_firmware"} == 0)
                      /
                      count(homeassistant_entity_available{domain="update", entity=~".*_firmware"})
                    ) > 0.5
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "{{ $value | humanizePercentage }} of Matter devices are unavailable"
