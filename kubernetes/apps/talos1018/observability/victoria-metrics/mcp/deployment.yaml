---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics-mcp
  labels:
    app.kubernetes.io/name: victoria-metrics-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics-mcp
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-metrics-mcp
          image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.20.2
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: VM_INSTANCE_ENTRYPOINT
              value: http://victoria-metrics-victoria-metrics-single-server:8428
            - name: VM_INSTANCE_TYPE
              value: single
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: "[::]:8080"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
