---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nrtm-check
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app: nrtm-check
        spec:
          restartPolicy: Never
          # full python:3 (not -slim) bundles curl + bash + awk the script needs
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nrtm-check
              image: python:3.13
              command: ["/bin/bash", "/scripts/nrtm_check.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: nrtm-check-script
                defaultMode: 0755
