---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# The chart attaches the syslog ports to its ClusterIP service, which LAN
# devices cannot reach.
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  labels:
    app.kubernetes.io/name: victoria-logs-syslog
    service.kubernetes.io/topology: internal
  annotations:
    io.cilium/lb-ipam-ips: "fd00:1018:0:5:3000::40,10.18.6.40"
    # DSR preserves the sender's address, which SNAT would otherwise replace
    # with the ingress node's IP.
    service.cilium.io/forwarding-mode: dsr
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  # Cilium's L2 announcer does not follow the backend node, so Local blackholes
  # traffic whenever the lease lands on a node without the single pod.
  externalTrafficPolicy: Cluster
  ports:
    - port: 514
      targetPort: syslog-udp
      protocol: UDP
      name: syslog-udp
    - port: 514
      targetPort: syslog-tcp
      protocol: TCP
      name: syslog-tcp
  selector:
    app: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
