---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chart:
    spec:
      chart: victoria-logs-single
      sourceRef:
        kind: HelmRepository
        name: vm
  interval: 1h0m0s
  values:
    server:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9428"
      extraArgs:
        httpListenAddr: "[::]:9428"
        enableTCP6: "true"
      # RFC3164 carries no year or timezone, so stamp on ingest.
      syslog:
        udp:
          - name: syslog-udp
            value: "[::]:5514"
            useLocalTimestamp: true
            useRemoteIP: true
        # Distinct port from UDP: the chart keys container ports by number, so
        # sharing 5514 collapses both into one entry with the wrong protocol.
        tcp:
          - name: syslog-tcp
            value: "[::]:5515"
            useLocalTimestamp: true
            useRemoteIP: true
      retentionPeriod: "365d"
      # Size backstop: evicts oldest-first so a noisy log source cannot fill the
      # volume and wedge the pod. Leaves headroom for background merges.
      retentionDiskSpaceUsage: "25GiB"
      persistentVolume:
        enabled: true
        existingClaim: victoria-logs-data-v2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      service:
        clusterIP: ""
      ingress:
        enabled: false
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/icon: sh-victoriametrics
          gethomepage.dev/name: VictoriaLogs
          gethomepage.dev/app: victoria-logs-single
        parentRefs:
          - name: main-gateway
            namespace: network
            sectionName: https-internal
        hostnames:
          - "vlogs.${CLUSTER_DOMAIN}"
        filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: Strict-Transport-Security
                  value: max-age=31536000
