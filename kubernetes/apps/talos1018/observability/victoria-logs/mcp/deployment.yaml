---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs-mcp
  labels:
    app.kubernetes.io/name: victoria-logs-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs-mcp
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-logs-mcp
          image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: VL_INSTANCE_ENTRYPOINT
              value: http://victoria-logs-victoria-logs-single-server:9428
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: "[::]:8081"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
