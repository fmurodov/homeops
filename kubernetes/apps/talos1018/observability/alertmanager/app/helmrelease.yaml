---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  chart:
    spec:
      chart: alertmanager
      sourceRef:
        kind: HelmRepository
        name: prometheus
  interval: 1h0m0s
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9093"
    # Links in notifications point at the real UI, not the pod hostname
    extraArgs:
      web.external-url: https://alertmanager.${CLUSTER_DOMAIN}
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    persistence:
      enabled: true
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce
      size: 50Mi
    ingress:
      enabled: false
    # Credentials mounted as files (never inlined into the config ConfigMap)
    extraSecretMounts:
      - name: alertmanager-secret
        mountPath: /etc/alertmanager/secrets
        secretName: alertmanager-secret
        readOnly: true
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: discord-warning
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Dead-man's-switch: the always-firing Watchdog pings healthchecks.io
          # on a heartbeat. If the cluster/alerting/internet dies, pings stop
          # and healthchecks.io notifies from outside.
          - matchers:
              - alertname="Watchdog"
            receiver: healthchecks
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 2m
          # Matched before severity="critical" below, so the daily liveness
          # receipt lands in the muted #heartbeat channel instead of paging.
          - matchers:
              - alertname="DailyHeartbeat"
            receiver: discord-heartbeat
            group_wait: 0s
          - matchers:
              - severity="critical"
            receiver: discord-critical
      receivers:
        - name: discord-warning
          discord_configs:
            - webhook_url_file: /etc/alertmanager/secrets/discord-warning-url
              send_resolved: true
        - name: discord-critical
          discord_configs:
            - webhook_url_file: /etc/alertmanager/secrets/discord-critical-url
              send_resolved: true
          webhook_configs:
            # ntfy native alertmanager template (no bridge). Publish over the
            # internal service; phone subscribes to the same topic externally.
            # Kept alongside Discord: ntfy is self-hosted and still reaches the
            # phone on LAN when the WAN or Discord itself is down.
            - url: "http://ntfy.observability.svc/alerts?template=alertmanager"
              send_resolved: true
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/alertmanager/secrets/ntfy-token
        - name: discord-heartbeat
          discord_configs:
            - webhook_url_file: /etc/alertmanager/secrets/discord-heartbeat-url
              send_resolved: false
        - name: healthchecks
          webhook_configs:
            - url_file: /etc/alertmanager/secrets/healthchecks-url
              send_resolved: false
      inhibit_rules:
        # A firing critical silences the matching warning for the same alert.
        - source_matchers:
            - severity="critical"
          target_matchers:
            - severity="warning"
          equal:
            - alertname
            - namespace
