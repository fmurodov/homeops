---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  chart:
    spec:
      chart: alertmanager
      sourceRef:
        kind: HelmRepository
        name: prometheus
  interval: 1h0m0s
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9093"
    # Links in notifications point at the real UI, not the pod hostname
    extraArgs:
      web.external-url: https://alertmanager.${CLUSTER_DOMAIN}
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    persistence:
      enabled: true
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce
      size: 50Mi
    ingress:
      enabled: false
    # Credentials mounted as files (never inlined into the config ConfigMap)
    extraSecretMounts:
      - name: alertmanager-secret
        mountPath: /etc/alertmanager/secrets
        secretName: alertmanager-secret
        readOnly: true
    config:
      global:
        resolve_timeout: 5m
        # Email via Resend (same SMTP pipeline as pocket-id). Port 587 = STARTTLS.
        smtp_smarthost: "smtp.resend.com:587"
        smtp_from: "alerts@resend.${DOMAIN}"
        smtp_auth_username: "resend"
        smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
        smtp_require_tls: true
      route:
        receiver: email
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Dead-man's-switch: the always-firing Watchdog pings healthchecks.io
          # on a heartbeat. If the cluster/alerting/internet dies, pings stop
          # and healthchecks.io notifies from outside.
          - matchers:
              - alertname="Watchdog"
            receiver: healthchecks
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 2m
          # Critical alerts go to both email and ntfy push.
          - matchers:
              - severity="critical"
            receiver: critical
      receivers:
        - name: email
          email_configs:
            - to: "${ALERT_EMAIL_TO}"
              send_resolved: true
        - name: critical
          email_configs:
            - to: "${ALERT_EMAIL_TO}"
              send_resolved: true
          webhook_configs:
            # ntfy native alertmanager template (no bridge). Publish over the
            # internal service; phone subscribes to the same topic externally.
            - url: "http://ntfy.observability.svc/alerts?template=alertmanager"
              send_resolved: true
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/alertmanager/secrets/ntfy-token
        - name: healthchecks
          webhook_configs:
            - url_file: /etc/alertmanager/secrets/healthchecks-url
              send_resolved: false
      inhibit_rules:
        # A firing critical silences the matching warning for the same alert.
        - source_matchers:
            - severity="critical"
          target_matchers:
            - severity="warning"
          equal:
            - alertname
            - namespace
