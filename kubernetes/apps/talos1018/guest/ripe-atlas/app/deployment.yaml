---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ripe-atlas
  labels:
    app.kubernetes.io/name: ripe-atlas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ripe-atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ripe-atlas
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ripe-atlas
          image: ghcr.io/jamesits/ripe-atlas:5130@sha256:841459abe5aac56833e94832b2460423b5b9532b6420df73bfec54dd3303643b
          env:
            # Report the pod's /proc/net/dev counters (lo, eth0: only the probe's own
            # traffic) as built-in measurement 9002 every ~3 min. The entrypoint appends
            # to config.txt on the PVC and the probe reads the first match, so to turn
            # this off again, delete /etc/ripe-atlas/config.txt as well.
            - name: RXTXRPT
              value: "yes"
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_RAW
                - CHOWN
                - SETUID
                - SETGID
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /etc/ripe-atlas
              subPath: etc
            - name: data
              mountPath: /var/spool/ripe-atlas
              subPath: spool
            - name: run
              mountPath: /run/ripe-atlas
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: "1"
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ripe-atlas-data
        - name: run
          emptyDir: {}
