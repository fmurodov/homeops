---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Longhorn - Storage system (Helm deployment)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-longhorn-app
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cilium-config
    - name: infra-cert-manager-config
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/longhorn/app
  prune: true
  # Losing this object must not delete every volume with it.
  deletionPolicy: Orphan
  wait: true
---
# Longhorn - Config (Backup, ingress, and additional resources)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-longhorn-config
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infra-longhorn-app
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/longhorn/config
  prune: true
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
