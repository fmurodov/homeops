---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - ./backup-secret.sops.yaml
  - ./backup-b2-secret.sops.yaml
  - ./daily-backup.yaml
  - ./weekly-trim.yaml
  - ./storageclass-2replicas.yaml
  - ./oauth2-proxy-secret.sops.yaml
  - ./httproute.yaml
  - ./metrics-networkpolicy.yaml
components:
  - ../../../../components/oauth2-proxy
configMapGenerator:
  - name: oauth2-proxy
    literals:
      - OAUTH2_PROXY_UPSTREAMS=http://longhorn-frontend:80
      - OAUTH2_PROXY_REDIRECT_URL=https://longhorn.${CLUSTER_DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_longhorn
