---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-trim
  namespace: longhorn-system
spec:
  # Longhorn only reclaims blocks once the filesystem discards them, so
  # actualSize otherwise grows with churn until a volume trips
  # LonghornVolumeActualSpaceUsedWarning. With removeSnapshotsDuringFilesystemTrim
  # each run also collapses the snapshot chain, costing the next backup a full
  # scan -- weekly keeps that cheap. Volumes opt in by label; RWX is excluded
  # because trim there goes through share-manager, not a block device.
  cron: "0 4 * * 0"
  task: "filesystem-trim"
  retain: 0
  concurrency: 1
  labels:
    schedule: "weekly"
