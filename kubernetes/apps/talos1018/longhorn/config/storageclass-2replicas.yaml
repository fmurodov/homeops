---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Opt-in StorageClass for regenerable volumes: two replicas instead of the
# default three. Repoint PVCs here (requires recreating the volume) to migrate.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-2replicas
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  dataLocality: "disabled"
