---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: sh-pocket-id
    gethomepage.dev/name: Pocket ID
    gethomepage.dev/app: pocket-id
    gethomepage.dev/description: Identity provider
spec:
  parentRefs:
    - name: main-gateway
      namespace: network
      sectionName: https-external
    - name: main-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "pid.${DOMAIN}"
    - "pid.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: pocket-id
          port: 1411
