---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      automountServiceAccountToken: false
      # Otherwise the "pocket-id" Service injects POCKET_ID_* variables.
      enableServiceLinks: false
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.19.1
          ports:
            - name: http
              containerPort: 1411
              protocol: TCP
          env:
            - name: DB_CONNECTION_STRING
              value: "file:/app/data/pocket-id.db?_journal_mode=WAL&_busy_timeout=2500&_txlock=immediate"
            - name: APP_URL
              value: "https://pid.${DOMAIN}"
            - name: INTERNAL_APP_URL
              value: "https://pid.${CLUSTER_DOMAIN}"
            - name: TRUST_PROXY
              value: "true"
            - name: TZ
              value: "${TIMEZONE}"
            - name: UPLOAD_PATH
              value: /app/data/uploads
            - name: SMTP_HOST
              value: smtp.resend.com
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_TLS
              value: tls
            - name: SMTP_FROM
              value: "pid@resend.${DOMAIN}"
            - name: SMTP_USER
              value: resend
            - name: UI_CONFIG_DISABLED
              value: "true"
            - name: EMAILS_VERIFIED
              value: "true"
            - name: EMAIL_LOGIN_NOTIFICATION_ENABLED
              value: "true"
            - name: EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED
              value: "true"
            - name: EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED
              value: "true"
            - name: EMAIL_API_KEY_EXPIRATION_ENABLED
              value: "true"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: ENCRYPTION_KEY
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: MAXMIND_LICENSE_KEY
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: SMTP_PASSWORD
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 250M
            limits:
              memory: 400M
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: var
              mountPath: /var
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
        - name: var
          emptyDir:
            sizeLimit: 1Gi
