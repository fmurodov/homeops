---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# claude-readonly - read-only identity for Claude's MCP servers (kubernetes-mcp-server
# on the Remote Control host). Can read everything except Secrets; cannot change anything.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-readonly
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/security/claude-readonly/app
  prune: true
  wait: true
