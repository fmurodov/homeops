---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Built-in `view`: core and apps resources plus CRDs that aggregate into it, no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-readonly-view
  labels:
    app.kubernetes.io/name: claude-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: claude-readonly
    namespace: security
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Read access `view` leaves out: cluster-scoped objects and the CRD groups this
# cluster runs on. Listed by group, not "*", because a wildcard would include Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-readonly
  labels:
    app.kubernetes.io/name: claude-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes, events]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io, apiextensions.k8s.io, networking.k8s.io, discovery.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups:
      - gateway.networking.k8s.io
      - cilium.io
      - longhorn.io
      - cert-manager.io
      - acme.cert-manager.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - upgrade.cattle.io
      - aquasecurity.github.io
      - k8s.cni.cncf.io
    resources: ["*"]
    verbs: [get, list, watch]
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-readonly
  labels:
    app.kubernetes.io/name: claude-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-readonly
subjects:
  - kind: ServiceAccount
    name: claude-readonly
    namespace: security
