---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Long-lived token for the kubeconfig on the Remote Control host. Kubernetes fills it
# in; nothing secret is committed. Delete the Secret to rotate.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: claude-readonly-token
  labels:
    app.kubernetes.io/name: claude-readonly
  annotations:
    kubernetes.io/service-account.name: claude-readonly
