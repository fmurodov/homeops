---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trivy-operator
spec:
  chart:
    spec:
      chart: trivy-operator
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
  interval: 1h0m0s
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
    operator:
      scanJobsConcurrentLimit: 1
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      infraAssessmentScannerEnabled: false
      # SBOM reports are ~100 MB in etcd and rewritten on every rescan, which
      # bloats etcd and the apiserver's watch cache. Vulnerability reports don't
      # need them; only ClusterVulnerabilityReports would.
      sbomGenerationEnabled: false
      # Standalone scan jobs run one trivy per workload container against a
      # shared cache, and all but one lose its lock after 5s, so pods with init
      # containers or sidecars never got a report (aquasecurity/trivy-operator#2967).
      builtInTrivyServer: true
    # Top level, not under operator: the chart never reads operator.resources.
    resources:
      requests:
        cpu: 10m
        memory: 576Mi
      limits:
        memory: 1Gi
    nodeCollector:
      excludeNodes: "*"
    serviceMonitor:
      enabled: false
    trivy:
      ignoreUnfixed: true
      # esphome's full report (4.6k CVEs, mostly kernel headers) is over the
      # 2 MiB limit on a single object write, so it was never stored.
      severity: CRITICAL,HIGH
      # The vulnerability DB is a re-downloadable cache.
      storageClassEnabled: false
      valuesFromConfigMap: trivy-server-env
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      slow: true
