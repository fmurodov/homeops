---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trivy-operator
spec:
  chart:
    spec:
      chart: trivy-operator
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
  interval: 1h0m0s
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
    operator:
      scanJobsConcurrentLimit: 1
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      infraAssessmentScannerEnabled: false
      # SBOM reports are ~100 MB in etcd and rewritten on every rescan, which
      # bloats etcd and the apiserver's watch cache. Vulnerability reports don't
      # need them; only ClusterVulnerabilityReports would.
      sbomGenerationEnabled: false
    # Top level, not under operator: the chart never reads operator.resources.
    resources:
      requests:
        cpu: 10m
        memory: 576Mi
      limits:
        memory: 1Gi
    nodeCollector:
      excludeNodes: "*"
    serviceMonitor:
      enabled: false
    trivy:
      ignoreUnfixed: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      slow: true
