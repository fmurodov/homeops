---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  labels:
    app.kubernetes.io/name: akvorado-clickhouse
data:
  akvorado.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>1</console>
        <log remove="1"/>
        <errorlog remove="1"/>
      </logger>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>
      <max_server_memory_usage_to_ram_ratio>0.8</max_server_memory_usage_to_ram_ratio>
      <mark_cache_size>536870912</mark_cache_size>
      <uncompressed_cache_size>0</uncompressed_cache_size>
      <!-- Nothing reads these and they outgrew the flow data 160x in a day.
           The Prometheus endpoint reads the live views, not this history. -->
      <asynchronous_metric_log remove="1"/>
      <metric_log remove="1"/>
      <trace_log remove="1"/>
      <text_log remove="1"/>
      <part_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></part_log>
      <query_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_log>
      <query_thread_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_thread_log>
      <query_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_metric_log>
      <query_views_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_views_log>
      <error_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></error_log>
      <latency_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></latency_log>
    </clickhouse>
