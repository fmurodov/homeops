---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: ConfigMap
metadata:
  name: akvorado-config
  labels:
    app.kubernetes.io/name: akvorado
data:
  akvorado.yaml: |
    ---
    kafka:
      topic: flows
      brokers:
        - akvorado-kafka:9092
      topic-configuration:
        num-partitions: 4
        replication-factor: 1
        config-entries:
          segment.bytes: 268435456
          retention.ms: 86400000
          cleanup.policy: delete
          compression.type: producer

    clickhousedb:
      servers:
        - akvorado-clickhouse:9000

    clickhouse:
      orchestrator-url: http://akvorado-orchestrator:8080
      # The rollups stay for query speed, not retention — all four expire together.
      resolutions:
        - interval: 0
          ttl: 8760h
        - interval: 1m
          ttl: 8760h
        - interval: 5m
          ttl: 8760h
        - interval: 1h
          ttl: 8760h

    schema:
      custom-dictionaries:
        devices:
          layout: complex_key_hashed
          keys:
            - name: addr
              type: String
          attributes:
            - name: name
              type: String
              default: ""
              label: DeviceName
          source: /run/akvorado-dict/devices.csv
          dimensions:
            - SrcAddr
            - DstAddr

    inlet:
      http:
        listen: "[::]:8080"
      flow:
        inputs:
          - type: udp
            decoder: netflow
            listen: "[::]:2055"
            workers: 2
          - type: udp
            decoder: netflow
            listen: "[::]:4739"
            workers: 2
          - type: udp
            decoder: sflow
            listen: "[::]:6343"
            workers: 2

    outlet:
      http:
        listen: "[::]:8080"
      geoip:
        optional: true
        asn-database:
          - /usr/share/GeoIP/GeoLite2-ASN.mmdb
        geo-database:
          - /usr/share/GeoIP/GeoLite2-Country.mmdb
      flow:
        state-persist-file: /run/akvorado/flow.state
      metadata:
        # cache-refresh must be >= cache-duration, which is idle eviction.
        cache-duration: 1h
        cache-refresh: 24h
        cache-persist-file: /run/akvorado/metadata.cache
        providers:
          # The bridges and ppp0 are virtual, so the gateway reports ifSpeed 0
          # for every interface flows actually traverse. Only static can decline
          # a query, so it goes first; unlisted ifIndexes fall through to SNMP.
          # ifIndexes are not stable across gateway reboots — re-check after one.
          - type: static
            exporters:
              10.18.6.1/32:
                name: 1018LC-GW-U-1
                skip-missing-interfaces: true
                ifindexes:
                  24: {name: br0, description: core, speed: 1000}
                  25: {name: br2, description: lan, speed: 1000}
                  26: {name: br3, description: iot, speed: 1000}
                  27: {name: br4, description: guest, speed: 1000}
                  28: {name: br5, description: security, speed: 1000}
                  29: {name: br6, description: srv, speed: 1000}
                  30: {name: br7, description: lan6, speed: 1000}
                  # 2.5G port, but the ISP hands over 1G — that is the ceiling
                  # utilisation should be measured against.
                  31: {name: ppp0, description: wan, speed: 1000}
          - type: snmp
            credentials: !include "snmp-credentials.yaml"
      networks:
        networks:
          10.18.1.0/24: {name: core, role: core}
          10.18.2.0/24: {name: lan, role: clients}
          10.18.3.0/24: {name: iot, role: iot}
          10.18.4.0/24: {name: guest, role: guest}
          10.18.5.0/24: {name: security, role: security}
          10.18.6.0/24: {name: srv, role: servers}
          10.18.7.0/24: {name: lan6, role: clients}
          "${IPV6_PREFIX_GUA}::/64": {name: core, role: core}
          "${IPV6_PREFIX_GUA}:1::/64": {name: lan, role: clients}
          "${IPV6_PREFIX_GUA}:2::/64": {name: iot, role: iot}
          "${IPV6_PREFIX_GUA}:3::/64": {name: guest, role: guest}
          "${IPV6_PREFIX_GUA}:4::/64": {name: security, role: security}
          "${IPV6_PREFIX_GUA}:5::/64": {name: srv, role: servers}
          "${IPV6_PREFIX_GUA}:6::/64": {name: lan6, role: clients}
          fd00:1018:0:5::/64: {name: srv, role: servers}
      core:
        # The gateway never advertises its rate, so this must mirror the UniFi
        # setting by hand or every byte figure is scaled by the mismatch.
        default-sampling-rate: 16
        # Defaults to flow, routing, networks. UniFi's IPFIX carries no AS
        # numbers and there is no routing provider, so only networks can answer.
        asn-providers:
          - networks
        interface-classifiers:
          - |
            (Interface.Name == "ppp0" || Interface.Description == "ppp0") &&
            ClassifyConnectivity("internet") &&
            ClassifyExternal()
          - |
            (Interface.Name startsWith "wg" || Interface.Description contains "WG") &&
            ClassifyConnectivity("vpn") &&
            ClassifyExternal()
          - ClassifyInternal()

    console:
      http:
        listen: "[::]:8080"
      database:
        driver: sqlite
        dsn: /var/lib/akvorado/console.sqlite
      auth:
        headers:
          login: X-Forwarded-User
          name: X-Forwarded-Preferred-Username
          email: X-Forwarded-Email
