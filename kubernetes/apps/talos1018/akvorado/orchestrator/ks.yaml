---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# akvorado orchestrator - owns the ClickHouse schema, the Kafka topic and the
# configuration served to the inlet, outlet and console
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: akvorado-orchestrator-app
  namespace: flux-system
spec:
  dependsOn:
    - name: akvorado-kafka-app
    - name: akvorado-clickhouse-app
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/talos1018/akvorado/orchestrator/app
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
