---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Exporters live on the LAN, so the collector ports need an address off the
# internal pool rather than a ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: akvorado-flows
  labels:
    app.kubernetes.io/name: akvorado-inlet
    service.kubernetes.io/topology: internal
  annotations:
    io.cilium/lb-ipam-ips: "fd00:1018:0:5:3000::41,10.18.6.41"
    # Akvorado keys exporters by source address, and SNAT would rewrite every
    # flow to the ingress node's IP. DSR keeps the gateway's address intact.
    service.cilium.io/forwarding-mode: dsr
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  # Cilium's L2 announcer does not follow the backend node, so Local blackholes
  # traffic whenever the lease lands on a node without the single pod.
  externalTrafficPolicy: Cluster
  ports:
    - port: 2055
      targetPort: netflow
      protocol: UDP
      name: netflow
    - port: 4739
      targetPort: ipfix
      protocol: UDP
      name: ipfix
    - port: 6343
      targetPort: sflow
      protocol: UDP
      name: sflow
  selector:
    app.kubernetes.io/name: akvorado-inlet
