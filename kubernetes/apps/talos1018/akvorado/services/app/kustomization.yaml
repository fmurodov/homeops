---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: akvorado
resources:
  - pvcs.yaml
  - inlet.yaml
  - flow-service.yaml
  - outlet.yaml
  - console.yaml
  - oauth2-proxy-secret.sops.yaml
  - akvorado-geoip-secret.sops.yaml
  - httproute.yaml
components:
  - ../../../../../components/oauth2-proxy
configMapGenerator:
  - name: oauth2-proxy
    literals:
      - OAUTH2_PROXY_UPSTREAMS=http://akvorado-console:8080
      - OAUTH2_PROXY_REDIRECT_URL=https://akvorado.${CLUSTER_DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_akvorado
      - OAUTH2_PROXY_PASS_BASIC_AUTH=false
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
