---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akvorado-outlet
  labels:
    app.kubernetes.io/name: akvorado-outlet
  # inlet, outlet and console do not mount akvorado-config — they fetch it from
  # the orchestrator over HTTP at startup — so reloader's "auto" never fires for
  # them. Naming the ConfigMap explicitly is what makes a config change reach
  # these three instead of only the orchestrator.
  annotations:
    configmap.reloader.stakater.com/reload: "akvorado-config"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: akvorado-outlet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akvorado-outlet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /api/v0/metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      containers:
        - name: outlet
          image: quay.io/akvorado/akvorado:2026.8.0
          args:
            - outlet
            - http://akvorado-orchestrator:8080
          env:
            # Rebuilding the network trie briefly holds two copies. Without a
            # ceiling the Go runtime keeps the freed one and RSS ratchets up
            # on every GeoIP refresh until the pod is OOMKilled.
            - name: GOMEMLIMIT
              value: 1536MiB
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: state
              mountPath: /run/akvorado
            - name: geoip
              mountPath: /usr/share/GeoIP
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/v0/healthcheck
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v0/healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v0/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: "2Gi"
            requests:
              cpu: "50m"
              memory: "512Mi"
        # A plain sidecar, not an init container: bad credentials must degrade
        # to no geo data, never stop the outlet from consuming flows.
        - name: geoipupdate
          image: ghcr.io/maxmind/geoipupdate:v8
          env:
            - name: GEOIPUPDATE_EDITION_IDS
              value: GeoLite2-ASN GeoLite2-Country
            - name: GEOIPUPDATE_FREQUENCY
              value: "72"
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: akvorado-geoip-secret
                  key: GEOIPUPDATE_ACCOUNT_ID
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: akvorado-geoip-secret
                  key: GEOIPUPDATE_LICENSE_KEY
          volumeMounts:
            - name: geoip
              mountPath: /usr/share/GeoIP
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: "256Mi"
            requests:
              cpu: "10m"
              memory: "32Mi"
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: akvorado-outlet-state
        - name: geoip
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir: {}
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: akvorado-outlet
  labels:
    app.kubernetes.io/name: akvorado-outlet
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: akvorado-outlet
