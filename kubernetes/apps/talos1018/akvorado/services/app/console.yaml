---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akvorado-console
  labels:
    app.kubernetes.io/name: akvorado-console
  annotations:
    configmap.reloader.stakater.com/reload: "akvorado-config"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: akvorado-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akvorado-console
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /api/v0/metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: quay.io/akvorado/akvorado:2026.8.0
          args:
            - console
            - http://akvorado-orchestrator:8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/akvorado
          startupProbe:
            httpGet:
              path: /api/v0/healthcheck
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v0/healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v0/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: "512Mi"
            requests:
              cpu: "10m"
              memory: "128Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: akvorado-console-data
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: akvorado-console
  labels:
    app.kubernetes.io/name: akvorado-console
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: akvorado-console
