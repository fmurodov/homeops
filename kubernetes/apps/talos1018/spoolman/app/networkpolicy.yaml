---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
# Spoolman's login is oauth2-proxy, so only it and the Homepage widget may
# reach it (homeops-project#132).
# kubelet probes come from the host, which Cilium allows by default.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spoolman
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spoolman
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
            app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
