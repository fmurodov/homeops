---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airnavradar
  labels:
    app.kubernetes.io/name: airnavradar
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airnavradar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airnavradar
    spec:
      containers:
        - name: airnavradar
          image: ghcr.io/sdr-enthusiasts/docker-airnavradar:latest-build-883
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              # s6-applyuidgid (drops from root to the runtime user) needs
              # these to call setuid()/setgroups() - without them it fails
              # with "unable to set supplementary group list".
              add: [SETUID, SETGID]
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BEASTHOST
              value: "readsb"
            - name: LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: LONG
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: ALT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_ALT
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_TZ
            - name: SHARING_KEY
              valueFrom:
                secretKeyRef:
                  name: airnavradar-config
                  key: AIRNAVRADAR_SHARING_KEY
            - name: ENABLE_MLAT
              value: "true"
          resources:
            limits:
              cpu: "0.02"
              memory: "50Mi"
            requests:
              cpu: "0.002"
              memory: "10Mi"
