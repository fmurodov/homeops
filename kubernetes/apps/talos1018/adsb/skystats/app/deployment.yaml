---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skystats
  labels:
    app.kubernetes.io/name: skystats
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skystats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skystats
    spec:
      containers:
        - name: skystats
          image: ghcr.io/tomcarman/skystats:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              add: [SETUID, SETGID, CHOWN]
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            # The image's bundled /etc/nginx/nginx.conf hardcodes
            # `listen 80 default_server;` only - no IPv6 variant, no
            # runtime guard generating it either (unlike readsb's
            # tar1090 template). This cluster's Services are IPv6-only,
            # so the Gateway can't reach it without also binding [::].
            # Patch it in once nginx is confirmed up (editing before
            # `nginx -s reload` finds no service to reload). Never fails
            # the hook - a failed postStart kills and restarts the
            # container, which would turn "IPv6 still off" into a crash
            # loop for no gain.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      s6-svstat /run/service/nginx 2>/dev/null | grep -q '^up' && break
                      sleep 1
                    done
                    if [ -f /etc/nginx/nginx.conf ] && ! grep -q 'listen \[::\]' /etc/nginx/nginx.conf; then
                      sed -i '/listen 80 default_server;/a\    listen [::]:80 default_server;' /etc/nginx/nginx.conf && nginx -s reload
                    fi
                    exit 0
          env:
            - name: READSB_AIRCRAFT_JSON
              value: "http://readsb/data/aircraft.json"
            - name: DB_HOST
              value: "skystats-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "skystats"
            - name: DB_NAME
              value: "skystats_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skystats-secret
                  key: DB_PASSWORD
            - name: LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: LON
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: RADIUS
              value: "500"
            - name: ABOVE_RADIUS
              value: "20"
            - name: DOMESTIC_COUNTRY_ISO
              value: "NL"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "0.2"
              memory: "256Mi"
            requests:
              cpu: "0.02"
              memory: "64Mi"
