---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skystats-db
  labels:
    app.kubernetes.io/name: skystats-db
spec:
  replicas: 1
  # RWO volume: surge pod can't attach while the old pod holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skystats-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skystats-db
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_USER
              value: "skystats"
            - name: POSTGRES_DB
              value: "skystats_db"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skystats-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: skystats-db-data
              mountPath: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
              name: postgres
          livenessProbe:
            exec:
              command: [pg_isready, -U, skystats, -d, skystats_db]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [pg_isready, -U, skystats, -d, skystats_db]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: "0.2"
              memory: "512Mi"
            requests:
              cpu: "0.02"
              memory: "240Mi"
      volumes:
        - name: skystats-db-data
          persistentVolumeClaim:
            claimName: skystats-db-data
