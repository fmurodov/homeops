---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skystats-db
  labels:
    app.kubernetes.io/name: skystats-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skystats-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skystats-db
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:18
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: POSTGRES_USER
              value: "skystats"
            - name: POSTGRES_DB
              value: "skystats_db"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skystats-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: skystats-db-data
              mountPath: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            limits:
              cpu: "0.2"
              memory: "512Mi"
            requests:
              cpu: "0.02"
              memory: "128Mi"
      volumes:
        - name: skystats-db-data
          persistentVolumeClaim:
            claimName: skystats-db-data
