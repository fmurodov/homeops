---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensky-network
  labels:
    app.kubernetes.io/name: opensky-network
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensky-network
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensky-network
    spec:
      containers:
        - name: opensky-network
          image: ghcr.io/sdr-enthusiasts/docker-opensky-network:latest-build-844
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BEASTHOST
              value: "readsb"
            - name: LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: LONG
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: ALT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_ALT
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_TZ
            - name: OPENSKY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensky-config
                  key: OPENSKY_USERNAME
            - name: OPENSKY_SERIAL
              valueFrom:
                secretKeyRef:
                  name: opensky-config
                  key: OPENSKY_SERIAL
          resources:
            limits:
              cpu: "0.02"
              memory: "50Mi"
            requests:
              cpu: "0.005"
              memory: "15Mi"
