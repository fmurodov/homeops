---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarvirtuel
  labels:
    app.kubernetes.io/name: radarvirtuel
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radarvirtuel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarvirtuel
    spec:
      containers:
        - name: radarvirtuel
          image: ghcr.io/sdr-enthusiasts/docker-radarvirtuel:latest-build-800
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BEASTHOST
              value: "readsb"
            - name: RV_LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: RV_LON
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: RV_ALT_M
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_ALT_M
            - name: RV_CONTRIB_NAME
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_SITENAME
            - name: RV_CONTRIB_EMAIL
              valueFrom:
                secretKeyRef:
                  name: radarvirtuel-config
                  key: RV_CONTRIB_EMAIL
            - name: RV_STATION_UID
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_UUID
          resources:
            # Steady state is ~49Mi against the old 50Mi cap, and the old 0.02
            # CPU cap throttled 98% of periods.
            limits:
              memory: "128Mi"
            requests:
              cpu: "0.05"
              memory: "64Mi"
