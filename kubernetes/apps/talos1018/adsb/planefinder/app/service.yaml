---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: planefinder
spec:
  # pfclient binds IPv4-only (0.0.0.0); dual-stack so the Gateway can
  # actually reach it, same as readsb.
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv6, IPv4]
  selector:
    app.kubernetes.io/name: planefinder
  ports:
    - port: 30053
      targetPort: 30053
