---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: planefinder
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: ADSB
    gethomepage.dev/icon: mdi-airplane
    gethomepage.dev/name: planefinder
    gethomepage.dev/app: planefinder
spec:
  parentRefs:
    - name: main-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "planefinder.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: planefinder
          port: 30053
