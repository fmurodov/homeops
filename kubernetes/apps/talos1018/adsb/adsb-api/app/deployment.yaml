---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          # Pinned before the "main" branch's 2026-03-13 provider refactor,
          # which left the /v2/* router's _reapi_route() factory uncalled
          # and never actually registers any routes (all /v2/* 404, no fork
          # available with a fix - see adsblol/api commit dfdd419f).
          image: ghcr.io/adsblol/api:sha-534a7c5
          # Image's default CMD binds --host 0.0.0.0 (IPv4-only). This
          # cluster's Services are IPv6-only, so the Gateway can't reach it
          # without also binding IPv6.
          command:
            - uvicorn
          args:
            - src.adsb_api.app:app
            - "--host=::"
            - --port=80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: ADSBLOL_REAPI_ENDPOINT
              value: "http://readsb.adsb.svc.cluster.local:30152/"
            - name: ADSBLOL_REDIS_HOST
              value: "redis://redis:6379"
            # Tasks reach for adsb.lol's own Kubernetes infra (feeder/mlat
            # aggregation, hub stats), unreachable from here.
            - name: ADSBLOL_ENABLED_BG_TASKS
              value: ""
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "0.2"
              memory: "768Mi"
            requests:
              cpu: "0.02"
              memory: "128Mi"
