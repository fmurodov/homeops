---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adsbhub
  labels:
    app.kubernetes.io/name: adsbhub
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adsbhub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adsbhub
    spec:
      containers:
        - name: adsbhub
          image: ghcr.io/sdr-enthusiasts/docker-adsbhub:latest-build-530
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              # s6-applyuidgid (drops from root to the runtime user) needs
              # these to call setuid()/setgroups() - without them it fails
              # with "unable to set supplementary group list".
              add: [SETUID, SETGID]
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            # SBS/BaseStation client, not Beast - readsb serves this on
            # :30003 by default.
            - name: SBSHOST
              value: "readsb"
            - name: LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: LONG
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_TZ
            - name: CLIENTKEY
              valueFrom:
                secretKeyRef:
                  name: adsbhub-config
                  key: ADSBHUB_CLIENTKEY
          resources:
            limits:
              cpu: "0.02"
              memory: "50Mi"
            requests:
              cpu: "0.005"
              memory: "15Mi"
