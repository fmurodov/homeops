---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: adsb
  labels:
    app.kubernetes.io/name: api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/adsblol/api:main
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Point the ADSBExchange-compatible /v2/* routes at our own readsb
            # net-api-port instead of adsb.lol's infrastructure.
            - name: ADSBLOL_REAPI_ENDPOINT
              value: "http://readsb.adsb.svc.cluster.local:30152/"
            - name: ADSBLOL_REDIS_HOST
              value: "redis://redis:6379"
            # Disable background tasks tied to adsb.lol's own Kubernetes
            # infra (feeder/mlat aggregation, hub stats) - not reachable
            # from here and not needed for the /v2/* endpoints.
            - name: ADSBLOL_ENABLED_BG_TASKS
              value: ""
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "0.2"
              memory: "150Mi"
            requests:
              cpu: "0.02"
              memory: "50Mi"
