---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readsb
  namespace: adsb
  labels:
    app.kubernetes.io/name: readsb
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: readsb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readsb
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: readsb
          image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest-build-845
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              # CHOWN: nginx chowns its runtime dirs (e.g. /var/lib/nginx/body)
              # to www-data on every worker start; without it nginx crash-loops.
              add: [SETUID, SETGID, CHOWN]
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: READSB_NET_ONLY
              value: "true"
            - name: BEASTHOST
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: BEASTHOST
            - name: BEASTPORT
              value: "30005"
            - name: LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: LONG
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: ALT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_ALT
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_TZ
            # nginx's /metrics location aliases /run/readsb/stats.prom, but
            # PROMETHEUS_ENABLE hardcodes /run/readsb-prometheus.prom - write
            # to the path nginx actually serves.
            - name: READSB_EXTRA_ARGS
              value: "--write-prom=/run/readsb/stats.prom"
            - name: UUID
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_UUID
            - name: MLAT_USER
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_SITENAME
            - name: ULTRAFEEDER_CONFIG
              value: "adsb,feed.adsb.fi,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090;adsb,feed.planespotters.net,30004,beast_reduce_plus_out;mlat,mlat.planespotters.net,31090;adsb,in.adsb.lol,30004,beast_reduce_plus_out;mlat,in.adsb.lol,31090"
          lifecycle:
            # This build's nginx template ships with no IPv6 listen
            # directive at all (upstream generates one only if it detects
            # ::1 on lo at container-init time, which this build doesn't).
            # This cluster's Services are IPv6-only, so add it ourselves.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      s6-svstat /run/service/nginx 2>/dev/null | grep -q '^up' && break
                      sleep 1
                    done
                    if ! grep -q 'listen \[::\]' /etc/nginx/sites-enabled/tar1090 2>/dev/null; then
                      sed -i '/listen 80 default_server;/a\  listen [::]:80 default_server;' /etc/nginx/sites-enabled/tar1090
                      nginx -s reload 2>/dev/null || true
                    fi
          ports:
            - containerPort: 30152
              name: net-api
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "0.4"
              memory: "350Mi"
            requests:
              cpu: "0.02"
              memory: "100Mi"
