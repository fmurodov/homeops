---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: piaware
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: ADSB
    gethomepage.dev/icon: si-flightaware
    gethomepage.dev/name: FlightAware
    gethomepage.dev/app: piaware
spec:
  parentRefs:
    - name: main-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "piaware.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: piaware
          port: 8088
