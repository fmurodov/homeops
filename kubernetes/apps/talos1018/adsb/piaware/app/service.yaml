---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: piaware
spec:
  # piaware's web/mgmt servers bind IPv4-only (0.0.0.0); dual-stack so the
  # Gateway can actually reach them, same as readsb.
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv6, IPv4]
  selector:
    app.kubernetes.io/name: piaware
  ports:
    - port: 8081
      targetPort: 8080
      name: mgmt
    - port: 8088
      targetPort: 80
      name: http
