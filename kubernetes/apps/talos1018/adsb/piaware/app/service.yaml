---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: piaware
spec:
  # piaware's web/mgmt servers bind IPv4-only (0.0.0.0) and the image has no
  # IPv6 option. IPv4-only rather than dual-stack: with both families the
  # Gateway's Envoy balances onto the dead IPv6 pod address and ~half the
  # requests 503.
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  selector:
    app.kubernetes.io/name: piaware
  ports:
    - port: 8081
      targetPort: 8080
      name: mgmt
    - port: 8088
      targetPort: 80
      name: http
