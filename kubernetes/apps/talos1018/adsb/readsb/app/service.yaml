---
apiVersion: v1
kind: Service
metadata:
  name: readsb
spec:
  # dual-stack: adsbhub's image hardcodes an IPv4-only socat connection
  # (TCP4:...) with no way to override it, so readsb needs an A record
  # alongside the cluster's usual IPv6-only ClusterIP.
  ipFamilyPolicy: PreferDualStack
  ipFamilies: [IPv6, IPv4]
  selector:
    app.kubernetes.io/name: readsb
  ports:
    - port: 30152
      targetPort: 30152
      name: net-api
    - port: 30005
      targetPort: 30005
      name: beast-out
    - port: 30003
      targetPort: 30003
      name: sbs-out
    - port: 80
      targetPort: 80
      name: http
