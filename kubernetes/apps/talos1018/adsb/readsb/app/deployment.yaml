---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readsb
  labels:
    app.kubernetes.io/name: readsb
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: readsb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readsb
    spec:
      containers:
        - name: readsb
          image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest-build-845
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              # CHOWN: nginx chowns its runtime dirs (e.g. /var/lib/nginx/body)
              # to www-data on every worker start; without it nginx crash-loops.
              add: [SETUID, SETGID, CHOWN]
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: globe-history
              mountPath: /var/globe_history
            - name: globe-history
              mountPath: /var/lib/collectd
              subPath: collectd
          env:
            - name: READSB_NET_ONLY
              value: "true"
            - name: BEASTHOST
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: EXTERNAL_BEASTHOST
            - name: BEASTPORT
              value: "30005"
            - name: LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: LONG
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: ALT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_ALT
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_TZ
            # nginx's /metrics location aliases /run/readsb/stats.prom, but
            # PROMETHEUS_ENABLE hardcodes /run/readsb-prometheus.prom - write
            # to the path nginx actually serves.
            - name: READSB_EXTRA_ARGS
              value: "--write-prom=/run/readsb/stats.prom"
            - name: UUID
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_UUID
            - name: MLAT_USER
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_SITENAME
            - name: ULTRAFEEDER_CONFIG
              value: "adsb,feed.adsb.fi,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090;adsb,feed.planespotters.net,30004,beast_reduce_plus_out;mlat,mlat.planespotters.net,31090;adsb,in.adsb.lol,30004,beast_reduce_plus_out;mlat,in.adsb.lol,31090"
            - name: TAR1090_USEROUTEAPI
              value: "true"
            # Without this, aircraft.json never carries type/registration fields.
            - name: TAR1090_ENABLE_AC_DB
              value: "true"
            - name: GRAPHS1090_DARKMODE
              value: "true"
            # Quotes are part of the value: this gets echoed unquoted into
            # config.js, and browser-fetched, so needs to be a valid JS
            # string literal pointing at a browser-reachable hostname.
            - name: TAR1090_ROUTEAPIURL
              value: '"https://adsb-api.${CLUSTER_DOMAIN}/api/0/routeset"'
          lifecycle:
            # Upstream only writes a `listen [::]:80` line if `ip a | grep
            # 'inet6 ::1'` passes when this image's own startup script runs
            # (added in sdr-enthusiasts/docker-tar1090@fdde0090 as a guard
            # against IPv4-only Docker hosts where binding [::] crashes
            # nginx entirely - see issue #308 / ultrafeeder#244). That check
            # doesn't reliably pass this early in this image's own boot
            # sequence under Cilium, even though the pod's netns has full
            # IPv6 by the time any container starts. No env var bypasses it,
            # so patch it in ourselves once nginx is confirmed up. Never
            # fails the hook (would restart-loop the pod for no gain) - if
            # something's missing, IPv6 just stays off, same as before.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      s6-svstat /run/service/nginx 2>/dev/null | grep -q '^up' && break
                      sleep 1
                    done
                    if [ -f /etc/nginx/sites-enabled/tar1090 ] && ! grep -q 'listen \[::\]' /etc/nginx/sites-enabled/tar1090; then
                      sed -i '/listen 80 default_server;/a\  listen [::]:80 default_server;' /etc/nginx/sites-enabled/tar1090 && nginx -s reload
                    fi
                    exit 0
          ports:
            - containerPort: 30152
              name: net-api
            - containerPort: 30005
              name: beast-out
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "0.4"
              memory: "420Mi"
            requests:
              cpu: "0.02"
              memory: "100Mi"
      volumes:
        - name: globe-history
          persistentVolumeClaim:
            claimName: readsb-data
