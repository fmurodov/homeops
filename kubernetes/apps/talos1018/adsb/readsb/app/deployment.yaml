---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readsb
  labels:
    app.kubernetes.io/name: readsb
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # RWO volume: surge pod can't attach while the old pod holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: readsb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readsb
    spec:
      containers:
        - name: readsb
          image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest-build-959
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              # CHOWN: nginx chowns its runtime dirs (e.g. /var/lib/nginx/body)
              # to www-data on every worker start; without it nginx crash-loops.
              add: [SETUID, SETGID, CHOWN]
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: globe-history
              mountPath: /var/globe_history
            - name: globe-history
              mountPath: /var/lib/collectd
              subPath: collectd
          env:
            - name: READSB_NET_ONLY
              value: "true"
            - name: LOGLEVEL
              value: "error"
            - name: BEASTHOST
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: EXTERNAL_BEASTHOST
            - name: BEASTPORT
              value: "30005"
            - name: LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LAT
            - name: LONG
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_LONG
            - name: ALT
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_ALT
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_TZ
            # nginx's /metrics location aliases /run/readsb/stats.prom, but
            # PROMETHEUS_ENABLE hardcodes /run/readsb-prometheus.prom - write
            # to the path nginx actually serves.
            - name: READSB_EXTRA_ARGS
              value: "--write-prom=/run/readsb/stats.prom"
            - name: UUID
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_UUID
            - name: MLAT_USER
              valueFrom:
                secretKeyRef:
                  name: adsb-config
                  key: FEEDER_SITENAME
            # Non-profit aggregators the ultrafeeder image can feed directly
            # (beast_reduce_plus_out + mlat-client), no separate container
            # needed: adsb.fi, planespotters.net, adsb.lol, airplanes.live,
            # theairtraffic.com, avdelphi.com (no MLAT).
            - name: ULTRAFEEDER_CONFIG
              value: "adsb,feed.adsb.fi,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090;adsb,feed.planespotters.net,30004,beast_reduce_plus_out;mlat,mlat.planespotters.net,31090;adsb,in.adsb.lol,30004,beast_reduce_plus_out;mlat,in.adsb.lol,31090;adsb,feed.airplanes.live,30004,beast_reduce_plus_out;mlat,feed.airplanes.live,31090;adsb,feed.theairtraffic.com,30004,beast_reduce_plus_out;mlat,mlat.theairtraffic.com,31090;adsb,data.avdelphi.com,24999,beast_reduce_plus_out"
            - name: TAR1090_USEROUTEAPI
              value: "true"
            # Enables type/registration fields in aircraft.json, used by skystats.
            - name: TAR1090_ENABLE_AC_DB
              value: "true"
            - name: GRAPHS1090_DARKMODE
              value: "true"
            # Quotes are part of the value: this gets echoed unquoted into
            # config.js, and browser-fetched, so needs to be a valid JS
            # string literal pointing at a browser-reachable hostname.
            - name: TAR1090_ROUTEAPIURL
              value: '"https://adsb-api.${CLUSTER_DOMAIN}/api/0/routeset"'
            # tar1090's nginx strips its `listen [::]:80` line unless it detects
            # ::1 at container startup (docker-tar1090#333), which isn't reliable
            # under Cilium. Force it on so the gateway reaches the dashboard over
            # IPv6 without depending on the startup detection winning the race.
            - name: ENABLE_IPV6
              value: "true"
          ports:
            - containerPort: 30152
              name: net-api
            - containerPort: 30005
              name: beast-out
            - containerPort: 30003
              name: sbs-out
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "0.4"
              memory: "420Mi"
            requests:
              cpu: "0.02"
              memory: "100Mi"
      volumes:
        - name: globe-history
          persistentVolumeClaim:
            claimName: readsb-data
