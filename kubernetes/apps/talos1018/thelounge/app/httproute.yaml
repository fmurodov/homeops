---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thelounge
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: sh-the-lounge
    gethomepage.dev/name: The Lounge
    gethomepage.dev/app: thelounge
    gethomepage.dev/description: Web IRC client
spec:
  parentRefs:
    - name: internal-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "thelounge.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: oauth2-proxy
          port: 4180
