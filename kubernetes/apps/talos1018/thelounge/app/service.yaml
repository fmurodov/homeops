---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: thelounge
  labels:
    app.kubernetes.io/name: thelounge
spec:
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  selector:
    app.kubernetes.io/name: thelounge
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
