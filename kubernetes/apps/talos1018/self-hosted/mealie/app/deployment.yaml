---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app.kubernetes.io/name: mealie
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: mealie
          image: "ghcr.io/mealie-recipes/mealie:v3.29.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: ALLOW_SIGNUP
              value: "false"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: API_HOST
              value: ""
            - name: TZ
              value: ${TIMEZONE}
            - name: BASE_URL
              value: "https://recipe.${DOMAIN}"
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: "Pocket ID"
            - name: OIDC_REMEMBER_ME
              value: "true"
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: https://pid.${DOMAIN}/.well-known/openid-configuration
            - name: OIDC_GROUPS_CLAIM
              value: groups
            - name: OIDC_ADMIN_GROUP
              value: "mealie-admin"
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            - mountPath: /app/data
              name: data
          startupProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "0.1"
              memory: "1000Mi"
            requests:
              cpu: "0.001"
              memory: "200Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
