---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-redis
  labels:
    app.kubernetes.io/name: sure-redis
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: sure-redis
          # renovate: datasource=docker depName=ghcr.io/valkey-io/valkey
          image: ghcr.io/valkey-io/valkey:9.1.2
          command:
            - valkey-server
            - --appendonly
            - "yes"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sure-redis-data
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: sure-redis
  labels:
    app.kubernetes.io/name: sure-redis
spec:
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  selector:
    app.kubernetes.io/name: sure-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
