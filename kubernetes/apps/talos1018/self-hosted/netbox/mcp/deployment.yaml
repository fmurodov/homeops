---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-mcp
  labels:
    app.kubernetes.io/name: netbox-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netbox-mcp
          image: docker.io/netboxlabs/netbox-mcp-server:1.2.1
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # In-cluster Service: no hairpin through the gateway, no TLS on this hop.
            - name: NETBOX_URL
              value: http://netbox.self-hosted.svc.cluster.local:8080/
            - name: TRANSPORT
              value: http
            - name: HOST
              value: "::"
            - name: PORT
              value: "8000"
            - name: HOME
              value: /tmp
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netbox-mcp-secret
                  key: NETBOX_TOKEN
            # Without it the HTTP transport is unauthenticated.
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netbox-mcp-secret
                  key: MCP_AUTH_TOKEN
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
