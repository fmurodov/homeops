---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox
  labels:
    app.kubernetes.io/name: netbox
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox
    spec:
      automountServiceAccountToken: false
      # Otherwise the "netbox" Service injects NETBOX_* variables.
      enableServiceLinks: false
      # The image has no USER directive; upstream compose runs it as netbox:root.
      securityContext:
        runAsUser: 999
        runAsGroup: 0
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Runs migrations once, before netbox and worker start, so they never race.
        - name: migrate
          # renovate: datasource=docker depName=ghcr.io/netbox-community/netbox
          image: ghcr.io/netbox-community/netbox:v4.7.1
          args: [/opt/netbox/docker-entrypoint.sh, "true"]
          envFrom: &envFrom
            - configMapRef:
                name: netbox-env
          env: &env
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secret
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netbox-secret
                  key: SECRET_KEY
            - name: API_TOKEN_PEPPER_1
              valueFrom:
                secretKeyRef:
                  name: netbox-secret
                  key: API_TOKEN_PEPPER_1
            - name: SOCIAL_AUTH_OIDC_KEY
              valueFrom:
                secretKeyRef:
                  name: netbox-secret
                  key: OIDC_CLIENT_ID
            - name: SOCIAL_AUTH_OIDC_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbox-secret
                  key: OIDC_CLIENT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      containers:
        - name: netbox
          # renovate: datasource=docker depName=ghcr.io/netbox-community/netbox
          image: ghcr.io/netbox-community/netbox:v4.7.1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom: *envFrom
          env: *env
          # ALLOWED_HOSTS is explicit; NetBox always appends localhost.
          startupProbe:
            httpGet: &httpGet
              path: /login/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: *httpGet
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: *httpGet
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts: &volumeMounts
            - name: data
              mountPath: /opt/netbox/netbox/media
              subPath: media
            - name: data
              mountPath: /opt/netbox/netbox/scripts
              subPath: scripts
        - name: worker
          # renovate: datasource=docker depName=ghcr.io/netbox-community/netbox
          image: ghcr.io/netbox-community/netbox:v4.7.1
          # Bypasses the entrypoint so the worker never runs migrations itself.
          command:
            - /opt/netbox/venv/bin/python
            - /opt/netbox/netbox/manage.py
            - rqworker
          envFrom: *envFrom
          env: *env
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts: *volumeMounts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netbox-data
