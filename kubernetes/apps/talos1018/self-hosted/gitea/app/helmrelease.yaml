---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
spec:
  chart:
    spec:
      chart: gitea
      sourceRef:
        kind: HelmRepository
        name: gitea
  interval: 1h
  values:
    replicaCount: 1

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    # SQLite is plenty for a single-user/small-team internal instance;
    # avoids running a Postgres cluster just for Gitea.
    persistence:
      enabled: true
      create: false
      claimName: gitea-data

    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    valkey:
      enabled: false
    valkey-cluster:
      enabled: false

    gitea:
      admin:
        existingSecret: gitea-secret

      config:
        database:
          DB_TYPE: sqlite3
        service:
          DISABLE_REGISTRATION: true

      oauth:
        - name: "Pocket ID"
          provider: openidConnect
          existingSecret: gitea-secret
          autoDiscoverUrl: https://pid.${CLUSTER_DOMAIN}/.well-known/openid-configuration
          scopes: "openid profile email groups"
          groupClaimName: groups
          adminGroup: gitea_admins

    gatewayAPI:
      enabled: true
      core:
        httpRoute:
          enabled: true
          tls: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Apps
            gethomepage.dev/icon: sh-gitea
            gethomepage.dev/name: Gitea
            gethomepage.dev/app: gitea
            gethomepage.dev/description: Self-hosted git server
          parentRefs:
            - name: main-gateway
              namespace: network
              sectionName: https-internal
          hostnames:
            - "gitea.${CLUSTER_DOMAIN}"
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              filters:
                - type: ResponseHeaderModifier
                  responseHeaderModifier:
                    set:
                      - name: Strict-Transport-Security
                        value: max-age=31536000
              backendRefs:
                - group: ""
                  kind: Service
                  name: gitea-http
                  port: 3000

        tcpRoute:
          enabled: true
          parentRefs:
            - name: main-gateway
              namespace: network
              sectionName: ssh
