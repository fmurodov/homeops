---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Otherwise the "n8n" Service injects N8N_* variables into n8n's own config namespace.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: n8n
          image: ghcr.io/n8n-io/n8n:2.44.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_SQLITE_VACUUM_ON_STARTUP
              value: "true"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "7"
            - name: EXECUTIONS_DATA_PRUNE_MAX_COUNT
              value: "50000"
            - name: GENERIC_TIMEZONE
              value: "${TIMEZONE}"
            - name: WEBHOOK_URL
              value: "https://n8n-webhook.${DOMAIN}/"
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PORT
              value: "8080"
            - name: N8N_HOST
              value: "n8n.${CLUSTER_DOMAIN}"
            - name: N8N_LOG_LEVEL
              value: info
            - name: N8N_LOG_OUTPUT
              value: console
            - name: N8N_METRICS
              value: "true"
            - name: N8N_METRICS_PREFIX
              value: n8n_
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 576Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data-rwo
