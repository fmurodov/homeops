---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data-rwo
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/daily-backup: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Superseded by n8n-data-rwo. Kept only as the migration rollback source;
# delete once the RWO volume is verified in production (runbook step 6).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/daily-backup: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
