---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-app
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: sh-n8n
    gethomepage.dev/name: n8n
    gethomepage.dev/app: n8n
    gethomepage.dev/description: Workflow automation
spec:
  parentRefs:
    - name: main-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "n8n.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: n8n
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-webhook
spec:
  parentRefs:
    - name: main-gateway
      namespace: network
      sectionName: https-external
  hostnames:
    - "n8n-webhook.${DOMAIN}"
  rules:
    # Only n8n's public trigger endpoints, plus /healthz for the external
    # uptime monitor; the editor, login and REST API stay on the internal route.
    - matches:
        - path:
            type: Exact
            value: /healthz
        - path:
            type: PathPrefix
            value: /webhook/
        - path:
            type: PathPrefix
            value: /webhook-test/
        - path:
            type: PathPrefix
            value: /webhook-waiting/
        - path:
            type: PathPrefix
            value: /form/
        - path:
            type: PathPrefix
            value: /form-test/
        - path:
            type: PathPrefix
            value: /form-waiting/
        - path:
            type: PathPrefix
            value: /mcp/
        - path:
            type: PathPrefix
            value: /mcp-test/
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: n8n
          port: 8080
