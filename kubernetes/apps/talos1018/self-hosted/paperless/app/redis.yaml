---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  labels:
    app.kubernetes.io/name: paperless-redis
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: paperless-redis
          image: ghcr.io/valkey-io/valkey:9.1.0
          args:
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-redis-data
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  labels:
    app.kubernetes.io/name: paperless-redis
spec:
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  selector:
    app.kubernetes.io/name: paperless-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
