---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-rwo
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/daily-backup: enabled
    recurring-job.longhorn.io/weekly-trim: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# Superseded by paperless-data-rwo, which holds the verified copy. Kept only as
# the migration rollback source: this Kustomization prunes, so deleting it here
# destroys the RWX volume and its share-manager. Drop it in its own PR once the
# RWO volume has run clean for a few days.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/daily-backup: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-redis-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/weekly-trim: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
