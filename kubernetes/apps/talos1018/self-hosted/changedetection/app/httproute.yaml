---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: changedetection
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: changedetection
    gethomepage.dev/name: changedetection
    gethomepage.dev/app: changedetection
    gethomepage.dev/description: Web page change detection
    gethomepage.dev/widget.type: changedetectionio
    gethomepage.dev/widget.url: http://changedetection.self-hosted.svc.cluster.local:5000
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_CHANGEDETECTION_APIKEY}}"
spec:
  parentRefs:
    - name: main-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "changedetection.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: changedetection
          port: 5000
