---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
# The image's bundled Caddyfile binds IPv4 only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wishlist
  labels:
    app.kubernetes.io/name: wishlist
data:
  Caddyfile: |
    {
        auto_https off
        admin off

        servers {
            trusted_proxies static private_ranges
            client_ip_headers Cf-Connecting-Ip
        }
    }

    :3280 {
        bind ::

        @static {
            file
            path *.ico *.css *.js *.gif *.jpg *.jpeg *.png *.svg *.woff *.woff2 *.webp
        }

        @not_sse {
            not path /wishlists/*/events
            not path /lists/*/events
        }

        @unlogged path *.ico *.css *.js *.gif *.jpg *.jpeg *.png *.svg *.woff *.woff2 *.webp /wishlists/*/events /lists/*/events

        log {
            format json
        }
        log_skip @unlogged

        handle_path /api/assets/* {
            header @static Cache-Control max-age=31536000
            root * /usr/src/app/uploads/
            file_server
        }

        encode @not_sse {
            gzip
        }

        reverse_proxy [::1]:3000 {
            flush_interval -1
        }
    }
