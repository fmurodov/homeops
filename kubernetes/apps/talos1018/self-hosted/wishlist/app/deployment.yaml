---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist
  labels:
    app.kubernetes.io/name: wishlist
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # RWO volume: a surge pod could never attach it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wishlist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wishlist
    spec:
      automountServiceAccountToken: false
      # Otherwise the "wishlist" Service injects WISHLIST_* variables.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: wishlist
          image: ghcr.io/cmintey/wishlist:v0.69.0
          ports:
            - name: http
              containerPort: 3280
              protocol: TCP
          env:
            - name: ORIGIN
              value: "https://wishlist.${DOMAIN}"
            - name: TOKEN_TIME
              value: "72"
            - name: DEFAULT_CURRENCY
              value: "EUR"
            - name: HOST
              value: "::"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /usr/src/app/data
              subPath: data
            - name: data
              mountPath: /usr/src/app/uploads
              subPath: uploads
            - name: caddyfile
              mountPath: /usr/src/app/Caddyfile
              subPath: Caddyfile
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wishlist-data
        - name: caddyfile
          configMap:
            name: wishlist
