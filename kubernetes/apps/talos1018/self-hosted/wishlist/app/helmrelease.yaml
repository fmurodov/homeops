---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wishlist
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      wishlist:
        containers:
          app:
            image:
              repository: ghcr.io/cmintey/wishlist
              tag: v0.66.0
            env:
              ORIGIN: "https://wishlist.${DOMAIN}"
              TOKEN_TIME: "72"
              DEFAULT_CURRENCY: "EUR"
              HOST: "::"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 512Mi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
    service:
      app:
        controller: wishlist
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv6
        ports:
          http:
            port: &port 3280
    route:
      app:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/icon: sh-cmintey-wishlist
          gethomepage.dev/name: Wishlist
          gethomepage.dev/app: wishlist
        parentRefs:
          - name: main-gateway
            namespace: network
            sectionName: https-external
        hostnames:
          - "wishlist.${DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31536000
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: wishlist-data
        advancedMounts:
          wishlist:
            app:
              - path: /usr/src/app/data
                subPath: data
              - path: /usr/src/app/uploads
                subPath: uploads
      caddyfile:
        type: configMap
        name: wishlist
        advancedMounts:
          wishlist:
            app:
              - path: /usr/src/app/Caddyfile
                subPath: Caddyfile
                readOnly: true
    # Override Caddy config to listen IPv6
    configMaps:
      caddyfile:
        data:
          Caddyfile: |
            {
                auto_https off
                admin off

                servers {
                    trusted_proxies static private_ranges
                    client_ip_headers Cf-Connecting-Ip
                }
            }

            :3280 {
                bind ::

                @static {
                    file
                    path *.ico *.css *.js *.gif *.jpg *.jpeg *.png *.svg *.woff *.woff2 *.webp
                }

                @not_sse {
                    not path /wishlists/*/events
                    not path /lists/*/events
                }

                @unlogged path *.ico *.css *.js *.gif *.jpg *.jpeg *.png *.svg *.woff *.woff2 *.webp /wishlists/*/events /lists/*/events

                log {
                    format filter {
                        wrap json
                        fields {
                            request>headers delete
                            request>tls delete
                            request>remote_port delete
                            resp_headers delete
                            bytes_read delete
                            user_id delete
                        }
                    }
                }
                log_skip @unlogged

                handle_path /api/assets/* {
                    header @static Cache-Control max-age=31536000
                    root * /usr/src/app/uploads/
                    file_server
                }

                encode @not_sse {
                    gzip
                }

                reverse_proxy [::1]:3000 {
                    flush_interval -1
                }
            }
