---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-mcp
  labels:
    app.kubernetes.io/name: unifi-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-mcp
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unifi-mcp
          image: ghcr.io/sirkirby/unifi-network-mcp:0.45.0@sha256:5c14d804e23b714850b58c4b45b722aeed9159d0acf47b182a3bfa92d2d17e7c
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Controller address, View Only account and the bearer token.
          envFrom:
            - secretRef:
                name: unifi-mcp-secret
          env:
            - name: UNIFI_MCP_HTTP_ENABLED
              value: "true"
            - name: UNIFI_MCP_HOST
              value: "::"
            - name: UNIFI_MCP_PORT
              value: "3000"
            - name: UNIFI_MCP_ALLOWED_HOSTS
              value: "unifi-mcp.${CLUSTER_DOMAIN},localhost,127.0.0.1"
            # The account is View Only; these refuse writes before they reach it.
            - name: UNIFI_TOOL_PERMISSION_MODE
              value: confirm
            - name: UNIFI_POLICY_CREATE
              value: "false"
            - name: UNIFI_POLICY_UPDATE
              value: "false"
            - name: UNIFI_POLICY_DELETE
              value: "false"
            # The event websocket is refused for View Only, and its failed
            # re-auth trips the client's lockout for the REST calls too.
            - name: UNIFI_NETWORK_WEBSOCKET_ENABLED
              value: "false"
            - name: HOME
              value: /tmp
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
