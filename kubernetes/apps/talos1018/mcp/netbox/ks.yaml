---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# NetBox MCP - read-only MCP server for NetBox
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox-mcp
  namespace: flux-system
spec:
  dependsOn:
    - name: netbox
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/talos1018/mcp/netbox/app
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
