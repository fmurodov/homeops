---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# talos1018's ifconfig, one replica, internal only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
resources:
  - ../../../../talos1018/network/ifconfig/app
patches:
  - target:
      kind: Deployment
      name: ifconfig
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "ip.${CLUSTER_DOMAIN}"
  - patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: ifconfig
  - patch: |
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: ifconfig
