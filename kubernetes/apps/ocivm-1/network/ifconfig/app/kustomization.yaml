---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# talos1018's ifconfig, one replica, internal only; plain HTTP too, for curl.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
resources:
  - ../../../../talos1018/network/ifconfig/app
patches:
  - target:
      kind: Deployment
      name: ifconfig
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "ip.${CLUSTER_DOMAIN}"
  - target:
      kind: HTTPRoute
      name: ifconfig-internal
    patch: |
      - op: add
        path: /spec/parentRefs/-
        value:
          name: internal-gateway
          namespace: network
          sectionName: http
      - op: add
        path: /metadata/annotations
        value:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Network
          gethomepage.dev/icon: mdi-ip-network
          gethomepage.dev/name: What is my IP
          gethomepage.dev/app: ifconfig
          gethomepage.dev/description: Echoes the requesting IP
  - patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: ifconfig
  - patch: |
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: ifconfig
