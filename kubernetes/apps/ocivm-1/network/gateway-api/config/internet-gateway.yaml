---
# Public, IPv6 only (the NSG lets no IPv4 in). Its address is assigned to the
# VNIC in fmurodov-tf.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internet-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: cilium-ipv6-only
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: "${OCI_IPV6_PREFIX}::20"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-external
      hostname: "*.${DOMAIN}"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: internet-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
