---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: sh-uptime-kuma
    gethomepage.dev/name: Uptime Kuma
    gethomepage.dev/app: uptime-kuma
    gethomepage.dev/description: Status pages
spec:
  parentRefs:
    - name: internal-gateway
      namespace: network
      sectionName: https-internal
  hostnames:
    - "status.${CLUSTER_DOMAIN}"
  rules:
    - backendRefs:
        - name: uptime-kuma
          port: 80
