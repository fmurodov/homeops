---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# talos1018's CoreDNS (same service range) without its dn42 forward.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../talos1018/kube-system/coredns/app
patches:
  - target:
      kind: ConfigMap
      name: coredns
    patch: |
      - op: replace
        path: /data/Corefile
        value: |
          .:53 {
              errors
              health {
                  lameduck 5s
              }
              ready
              log . {
                  class error
              }
              prometheus :9153
              kubernetes cluster.local in-addr.arpa ip6.arpa {
                  pods insecure
                  fallthrough in-addr.arpa ip6.arpa
                  ttl 30
              }
              forward . /etc/resolv.conf {
                 max_concurrent 1000
              }
              cache 30 {
                 disable success cluster.local
                 disable denial cluster.local
              }
              loop
              reload
              loadbalance
          }
