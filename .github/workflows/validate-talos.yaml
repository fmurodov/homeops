---
name: Validate Talos Configs
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags-ignore: ["*"]
    paths:
      - "talos/**"
      - "scripts/validate.sh"
      - ".github/workflows/validate-talos.yaml"

env:
  # renovate: datasource=github-releases depName=siderolabs/talos
  TALOSCTL_VERSION: v1.14.2

jobs:
  validate:
    name: Validate Talos Node Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install talosctl
        run: |
          base="https://github.com/siderolabs/talos/releases/download/${TALOSCTL_VERSION}"
          curl -fsSLO "$base/talosctl-linux-amd64"
          curl -fsSL "$base/sha256sum.txt" | grep ' talosctl-linux-amd64$' | sha256sum -c -
          sudo install -m 0755 talosctl-linux-amd64 /usr/local/bin/talosctl
          talosctl version --client

      - name: Validate Talos configurations
        run: ./scripts/validate.sh talos
